        const ReportsModule = ({ user }) => {
            const today = getTodayWitaDateString();
            const [reportType, setReportType] = useState('habits');
            const [startDate, setStartDate] = useState(today);
            const [endDate, setEndDate] = useState(today);
            const [selectedClassId, setSelectedClassId] = useState('all');
            const [selectedStudentId, setSelectedStudentId] = useState('all');
            const [selectedScope, setSelectedScope] = useState('all');

            const [classes, setClasses] = useState([]);
            const [students, setStudents] = useState([]);
            const [habitLogs, setHabitLogs] = useState([]);
            const [journals, setJournals] = useState([]);

            const loadReportData = async () => {
                const c = await db.classes.toArray();
                const s = await db.users.where('role').equals(ROLES.SISWA).toArray();
                const hl = await db.habitLogs.toArray();
                const j = await db.journals.toArray();
                setClasses(c); setStudents(s); setHabitLogs(hl); setJournals(j);
            };

            useEffect(() => { loadReportData(); }, []);

            const accessibleStudents = useMemo(() => {
                if (user.role === ROLES.ADMIN) return students;
                return students.filter(s => {
                    const isHomeroom = user.homeroomClassId && s.classId === user.homeroomClassId;
                    const isMentor = s.mentorId === user.id;
                    if (selectedScope === 'homeroom') return isHomeroom;
                    if (selectedScope === 'mentor') return isMentor;
                    return isHomeroom || isMentor;
                });
            }, [students, user, selectedScope]);

            const filteredStudentList = useMemo(() => {
                let list = accessibleStudents;
                if (user.role === ROLES.ADMIN && selectedClassId !== 'all') list = list.filter(s => s.classId === selectedClassId);
                if (selectedStudentId !== 'all') list = list.filter(s => s.id === selectedStudentId);
                return list.sort((a, b) => a.name.localeCompare(b.name));
            }, [accessibleStudents, selectedClassId, selectedStudentId, user.role]);

            const dateRangeList = useMemo(() => getDatesInRange(startDate, endDate), [startDate, endDate]);

            const studentDetailedHabits = useMemo(() => {
                return filteredStudentList.map(student => {
                    const studentLogs = habitLogs.filter(l => l.userId === student.id && l.date >= startDate && l.date <= endDate);
                    const logMap = {};
                    studentLogs.forEach(l => { logMap[`${l.date}_${l.habitId}`] = l; });

                    const daysBreakdown = dateRangeList.map(dateStr => {
                        const habits = HABITS_CONFIG.map(h => {
                            const log = logMap[`${dateStr}_${h.id}`];
                            return {
                                habitId: h.id, habitName: h.name, icon: h.icon,
                                completed: log ? log.completed : false,
                                timeValue: log ? log.timeValue : '-',
                                detailValue: log ? log.detailValue : '-'
                            };
                        });
                        return { date: dateStr, habits, completedCount: habits.filter(h => h.completed).length };
                    });

                    const flatRows = [];
                    let rowCounter = 1;
                    daysBreakdown.forEach(day => {
                        day.habits.forEach(h => {
                            flatRows.push({
                                no: rowCounter++, date: day.date, habitName: h.habitName, icon: h.icon,
                                completed: h.completed, timeValue: h.timeValue, detailValue: h.detailValue
                            });
                        });
                    });

                    const totalCompleted = flatRows.filter(r => r.completed).length;
                    const totalPossible = flatRows.length;
                    const percentage = totalPossible > 0 ? Math.round((totalCompleted / totalPossible) * 100) : 0;

                    return { student, daysBreakdown, flatRows, totalCompleted, totalPossible, percentage };
                });
            }, [filteredStudentList, habitLogs, startDate, endDate, dateRangeList]);

            const handleExportExcel = () => {
                if (reportType === 'habits') {
                    if (studentDetailedHabits.length === 0) return showAlert.warning('Data Kosong', 'Tidak ada data log kebiasaan.');

                    const aoaData = [
                        [SCHOOL_IDENTITY.name.toUpperCase()],
                        [`LAPORAN RINCIAN PROGRAM 7 KEBIASAAN ANAK INDONESIA HEBAT (PER SISWA)`],
                        [`Periode: ${startDate} s.d. ${endDate} | Tahun Ajaran: ${SCHOOL_IDENTITY.academicYear}`],
                        []
                    ];

                    studentDetailedHabits.forEach((item, idx) => {
                        const s = item.student;
                        aoaData.push([`TABEL DATA SISWA ${idx + 1}: ${s.name.toUpperCase()}`]);
                        aoaData.push([`NISN: ${s.nisn || '-'}`, `Kelas: ${s.className || '-'}`, `Guru Mentor: ${s.mentorName || '-'}`, `Total Capaian: ${item.totalCompleted}/${item.totalPossible} (${item.percentage}%)`]);
                        aoaData.push(['No', 'Tanggal', 'Pilar Kebiasaan', 'Status', 'Jam (WITA)', 'Keterangan Aktivitas / Detail']);

                        item.daysBreakdown.forEach(day => {
                            day.habits.forEach((h, hIdx) => {
                                aoaData.push([hIdx + 1, day.date, h.habitName, h.completed ? 'Selesai' : 'Belum Selesai', h.timeValue || '-', h.detailValue || '-']);
                            });
                        });
                        aoaData.push([]);
                    });

                    const worksheet = XLSX.utils.aoa_to_sheet(aoaData);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Rincian 7 Kebiasaan");
                    XLSX.writeFile(workbook, `Laporan_Rinci_7Kebiasaan_${startDate}_sd_${endDate}.xlsx`);
                    showAlert.success('Berhasil Diunduh', 'File Excel berhasil diekspor.');
                }
            };

            const handleExportPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('landscape', 'pt', 'a4');
                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();

                if (studentDetailedHabits.length === 0) return showAlert.warning('Data Kosong', 'Tidak ada data siswa.');

                studentDetailedHabits.forEach((item, index) => {
                    if (index > 0) doc.addPage('landscape');

                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(13);
                    doc.text(SCHOOL_IDENTITY.name.toUpperCase(), pageWidth / 2, 38, { align: 'center' });

                    doc.setFontSize(10);
                    doc.setFont('helvetica', 'normal');
                    doc.text(`LAPORAN RINCIAN PEMBIASAAN 7 KEBIASAAN ANAK INDONESIA HEBAT`, pageWidth / 2, 52, { align: 'center' });
                    doc.text(`Periode: ${formatDisplayDate(startDate)} s.d. ${formatDisplayDate(endDate)} • Tahun Ajaran ${SCHOOL_IDENTITY.academicYear}`, pageWidth / 2, 65, { align: 'center' });

                    doc.setDrawColor(220, 220, 220);
                    doc.setLineWidth(1);
                    doc.line(40, 74, pageWidth - 40, 74);

                    const s = item.student;
                    doc.setFontSize(9);
                    doc.setFont('helvetica', 'bold');
                    doc.text(`Nama Siswa    : ${s.name}`, 40, 92);
                    doc.text(`Kelas / Rombel: ${s.className || '-'}`, 40, 106);
                    doc.text(`NISN              : ${s.nisn || '-'}`, pageWidth - 260, 92);
                    doc.text(`Guru Mentor   : ${s.mentorName || '-'}`, pageWidth - 260, 106);

                    const tableBody = item.flatRows.map(r => [r.no, r.date, r.habitName, r.completed ? 'Selesai' : 'Belum Selesai', r.timeValue || '-', r.detailValue || '-']);

                    doc.autoTable({
                        startY: 116,
                        head: [['No', 'Tanggal', 'Pilar Kebiasaan', 'Status', 'Jam (WITA)', 'Keterangan Aktivitas / Detail']],
                        body: tableBody,
                        foot: [['TOTAL', '', '', `${item.totalCompleted} / ${item.totalPossible} (${item.percentage}%) Selesai`, '', '']],
                        theme: 'grid',
                        headStyles: { fillColor: [239, 68, 68], textColor: 255, fontStyle: 'bold', halign: 'center', fontSize: 8 },
                        footStyles: { fillColor: [243, 244, 246], textColor: [31, 41, 55], fontStyle: 'bold', halign: 'center', fontSize: 8 },
                        styles: { fontSize: 8, cellPadding: 4, valign: 'middle' },
                        columnStyles: { 0: { halign: 'center', cellWidth: 30 }, 1: { halign: 'center', cellWidth: 70 }, 2: { cellWidth: 120, fontStyle: 'bold' }, 3: { halign: 'center', cellWidth: 70 }, 4: { halign: 'center', cellWidth: 60 }, 5: { cellWidth: 'auto' } }
                    });

                    const finalY = doc.lastAutoTable.finalY + 25;
                    const sigY = finalY > pageHeight - 85 ? pageHeight - 85 : finalY;
                    const sigX = pageWidth - 190;

                    doc.setTextColor(0, 0, 0);
                    doc.setDrawColor(0, 0, 0);

                    doc.setFontSize(9);
                    doc.setFont('helvetica', 'normal');
                    doc.text(`Talaga Jaya, ${formatDisplayDate(today)}`, sigX, sigY);
                    doc.text(user.role === ROLES.ADMIN ? 'Administrator Sistem,' : 'Guru Pembimbing / Wali Kelas,', sigX, sigY + 13);

                    doc.setFontSize(9.5);
                    doc.setFont('helvetica', 'bold');
                    doc.text(user.name, sigX, sigY + 48);

                    const nameWidth = doc.getTextWidth(user.name);
                    doc.setLineWidth(1.1);
                    doc.line(sigX, sigY + 50, sigX + nameWidth, sigY + 50);

                    if (user.nip) {
                        doc.setFontSize(9);
                        doc.setFont('helvetica', 'bold');
                        doc.text(`NIP: ${user.nip}`, sigX, sigY + 62);
                    }
                });

                doc.save(`Laporan_Rinci_7Kebiasaan_${startDate}_sd_${endDate}.pdf`);
                showAlert.success('Berhasil Diunduh', 'File PDF per siswa berhasil diekspor.');
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 no-print">
                        <div>
                            <h1 className="text-2xl font-black text-brand-dark">📊 Laporan Rinci Per Siswa & Harian</h1>
                            <p className="text-gray-500 font-medium text-sm">Laporan pembiasaan karakter dengan tabel mandiri per siswa yang dipisahkan per hari.</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                            <Button variant="green" onClick={handleExportExcel} className="text-xs py-2 px-3.5"><i className="fas fa-file-excel mr-1"></i> Ekspor Excel</Button>
                            <Button variant="primary" onClick={handleExportPDF} className="text-xs py-2 px-3.5"><i className="fas fa-file-pdf mr-1"></i> Cetak / Unduh PDF</Button>
                        </div>
                    </div>

                    <Card className="no-print space-y-4">
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
                            <div>
                                <label className="block font-bold text-gray-600 mb-1">Mulai Tanggal</label>
                                <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full p-2.5 bg-gray-50 border rounded-xl font-bold text-brand-dark" />
                            </div>
                            <div>
                                <label className="block font-bold text-gray-600 mb-1">Sampai Tanggal</label>
                                <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="w-full p-2.5 bg-gray-50 border rounded-xl font-bold text-brand-dark" />
                            </div>
                            {user.role === ROLES.ADMIN ? (
                                <div>
                                    <label className="block font-bold text-gray-600 mb-1">Filter Kelas</label>
                                    <select value={selectedClassId} onChange={e => setSelectedClassId(e.target.value)} className="w-full p-2.5 bg-gray-50 border rounded-xl font-bold">
                                        <option value="all">-- Semua Kelas --</option>
                                        {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                </div>
                            ) : (
                                <div>
                                    <label className="block font-bold text-gray-600 mb-1">Kategori Binaan Guru</label>
                                    <select value={selectedScope} onChange={e => setSelectedScope(e.target.value)} className="w-full p-2.5 bg-gray-50 border rounded-xl font-bold">
                                        <option value="all">Semua Siswa Binaan</option>
                                        <option value="homeroom">Kelas Binaan</option>
                                        <option value="mentor">Kelompok Mentoring</option>
                                    </select>
                                </div>
                            )}
                            <div>
                                <label className="block font-bold text-gray-600 mb-1">Pilih Siswa Spesifik</label>
                                <select value={selectedStudentId} onChange={e => setSelectedStudentId(e.target.value)} className="w-full p-2.5 bg-gray-50 border rounded-xl font-bold">
                                    <option value="all">-- Semua Siswa ({filteredStudentList.length}) --</option>
                                    {accessibleStudents.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                </select>
                            </div>
                        </div>
                    </Card>

                    {studentDetailedHabits.length === 0 ? (
                        <EmptyState icon="👦" title="Tidak Ada Data Siswa" description="Ubah filter kelas atau rentang tanggal untuk melihat data pembiasaan." />
                    ) : (
                        <div className="space-y-6">
                            {studentDetailedHabits.map(item => {
                                const s = item.student;
                                return (
                                    <Card key={s.id} className="space-y-4 border-t-4 border-t-brand-red">
                                        <div className="flex flex-col md:flex-row md:items-center justify-between border-b pb-3 gap-3">
                                            <div className="flex items-center gap-3">
                                                <div className="w-12 h-12 rounded-2xl bg-brand-red/10 text-brand-red flex items-center justify-center font-black text-xl">{s.avatar || '👦'}</div>
                                                <div>
                                                    <h3 className="font-black text-brand-dark text-lg">{s.name}</h3>
                                                    <p className="text-xs text-gray-500 font-bold">NISN: {s.nisn || '-'} • Kelas: <span className="text-brand-red font-black">{s.className || '-'}</span> • Mentor: <span className="text-brand-blue font-bold">{s.mentorName || '-'}</span></p>
                                                </div>
                                            </div>
                                            <span className="text-xs px-3.5 py-1.5 bg-green-50 border border-green-200 text-green-700 font-black rounded-xl">Capaian: {item.totalCompleted}/{item.totalPossible} (${item.percentage}%)</span>
                                        </div>

                                        <div className="space-y-4">
                                            {item.daysBreakdown.map(day => (
                                                <div key={day.date} className="bg-gray-50/70 p-3 rounded-xl border border-gray-100 space-y-2">
                                                    <div className="flex justify-between items-center px-1">
                                                        <span className="font-extrabold text-xs text-brand-dark flex items-center gap-1.5"><i className="far fa-calendar-alt text-brand-red"></i> {formatDisplayDate(day.date)} (WITA)</span>
                                                        <span className={`text-[11px] font-black px-2.5 py-0.5 rounded-full ${day.completedCount === 7 ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-600'}`}>{day.completedCount}/7 Selesai</span>
                                                    </div>
                                                    <div className="overflow-x-auto bg-white rounded-lg border border-gray-100 shadow-sm">
                                                        <table className="w-full text-left text-xs whitespace-nowrap">
                                                            <thead className="bg-gray-100/70 text-gray-600 font-extrabold">
                                                                <tr><th className="p-2.5 text-center w-10">No</th><th className="p-2.5 w-48">Kebiasaan</th><th className="p-2.5 text-center w-28">Status</th><th className="p-2.5 text-center w-24">Jam</th><th className="p-2.5">Keterangan</th></tr>
                                                            </thead>
                                                            <tbody>
                                                                {day.habits.map((h, hIdx) => (
                                                                    <tr key={h.habitId} className="border-b border-gray-50">
                                                                        <td className="p-2.5 text-center text-gray-400">{hIdx + 1}</td>
                                                                        <td className="p-2.5 font-bold text-gray-800">{h.icon} {h.habitName}</td>
                                                                        <td className="p-2.5 text-center"><span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${h.completed ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-400'}`}>{h.completed ? 'Selesai' : 'Belum'}</span></td>
                                                                        <td className="p-2.5 text-center font-bold text-brand-blue">{h.timeValue || '-'}</td>
                                                                        <td className="p-2.5 text-gray-600 italic">{h.detailValue || '-'}</td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </Card>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // LOGIN & ROOT CONTROLLER (LOCAL-FIRST INSTANT LOAD)
        // ==========================================
        const LandingPage = ({ onStart }) => (
            <div className="min-h-screen bg-white flex flex-col justify-center items-center px-4 text-center">
                <div className="text-6xl mb-3">🇮🇩</div>
                <h1 className="text-3xl md:text-5xl font-black text-brand-dark mb-3">7 Kebiasaan <span className="text-brand-red">Anak Indonesia Hebat</span></h1>
                <p className="text-gray-500 max-w-md text-sm md:text-base mb-8">Pencatatan pembiasaan karakter positif siswa {SCHOOL_IDENTITY.name}.</p>
                <Button onClick={onStart} className="text-base py-3.5 px-8">Masuk ke Aplikasi</Button>
            </div>
        );

        const LoginPage = ({ onLogin, triggerManualPull }) => {
            const [users, setUsers] = useState([]);
            const [selectedRole, setSelectedRole] = useState(ROLES.SISWA);
            const [selectedUserId, setSelectedUserId] = useState('');
            const [inputPassword, setInputPassword] = useState('');
            const [searchQuery, setSearchQuery] = useState('');

            const loadUsers = async () => {
                const res = await db.users.where('role').equals(selectedRole).toArray();
                setUsers(res);
                if (res.length > 0) setSelectedUserId(res[0].id); else setSelectedUserId('');
            };

            useEffect(() => { 
                loadUsers(); 
                setInputPassword('');
                setSearchQuery('');
            }, [selectedRole]);

            // Local-First: Langsung load dari IndexedDB tanpa menahan UI (Non-blocking background pull)
            useEffect(() => {
                loadUsers();
                if (navigator.onLine) {
                    pullAllCloudData().then(() => loadUsers());
                }
            }, []);

            const filteredUsers = useMemo(() => {
                const q = searchQuery.toLowerCase().trim();
                if (!q) return users;
                return users.filter(u => 
                    (u.name && u.name.toLowerCase().includes(q)) || 
                    (u.username && u.username.toLowerCase().includes(q)) || 
                    (u.nisn && u.nisn.includes(q)) ||
                    (u.nip && u.nip.includes(q))
                );
            }, [users, searchQuery]);

            useEffect(() => {
                if (filteredUsers.length > 0) {
                    if (!filteredUsers.some(u => u.id === selectedUserId)) {
                        setSelectedUserId(filteredUsers[0].id);
                    }
                } else {
                    setSelectedUserId('');
                }
            }, [filteredUsers]);

            const handleForgotPassword = () => {
                if (selectedRole === ROLES.SISWA) {
                    Swal.fire({
                        icon: 'info',
                        title: 'Lupa Kata Sandi?',
                        html: `
                            <div class="text-left text-xs space-y-2.5 text-gray-700 pt-2 leading-relaxed">
                                <p>Silakan hubungi <b>Guru Wali Kelas</b> atau <b>Guru Pembimbing / Mentor</b> Anda.</p>
                                <p class="bg-red-50 p-2.5 rounded-xl border border-red-200 text-brand-red font-medium">
                                    💡 Guru Anda dapat langsung mereset kata sandi akun Anda melalui tombol <b>Reset Sandi</b> pada panel guru.
                                </p>
                            </div>
                        `,
                        confirmButtonColor: '#EF4444',
                        confirmButtonText: 'Saya Mengerti',
                        customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-xl font-bold px-5 py-2.5' }
                    });
                } else if (selectedRole === ROLES.GURU) {
                    Swal.fire({
                        icon: 'info',
                        title: 'Lupa Kata Sandi Guru?',
                        html: `
                            <div class="text-left text-xs space-y-2.5 text-gray-700 pt-2 leading-relaxed">
                                <p>Silakan hubungi <b>Administrator Sistem Sekolah</b> untuk mereset kata sandi akun Guru Anda.</p>
                                <p class="bg-blue-50 p-2.5 rounded-xl border border-blue-200 text-brand-blue font-medium">
                                    💡 Administrator dapat mereset sandi Anda ke kata sandi standar (<code>guru123</code>) atau sandi kustom.
                                </p>
                            </div>
                        `,
                        confirmButtonColor: '#EF4444',
                        confirmButtonText: 'Saya Mengerti',
                        customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-xl font-bold px-5 py-2.5' }
                    });
                } else {
                    Swal.fire({
                        icon: 'info',
                        title: 'Lupa Sandi Administrator?',
                        html: `
                            <div class="text-left text-xs space-y-2 text-gray-700 pt-2 leading-relaxed">
                                <p>Kata sandi bawaan Super Admin adalah <code>admin</code>.</p>
                                <p>Jika telah diubah dan Anda lupa, silakan periksa lembar spreadsheet <b>Users</b> pada Google Sheets backend.</p>
                            </div>
                        `,
                        confirmButtonColor: '#EF4444',
                        confirmButtonText: 'Saya Mengerti',
                        customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-xl font-bold px-5 py-2.5' }
                    });
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!selectedUserId) return showAlert.warning('Perhatian', 'Pilih akun Anda!');
                const user = await db.users.get(selectedUserId);
                if (!user) return showAlert.error('Gagal', 'Akun tidak ditemukan!');

                const typedPassword = String(inputPassword).trim();
                if (user.role === ROLES.ADMIN) {
                    if (typedPassword !== String(user.password || 'admin').trim()) return showAlert.error('Akses Ditolak', 'Password salah!');
                } else {
                    const inputHashed = await hashPassword(typedPassword);
                    const defaultPass = user.role === ROLES.GURU ? 'guru123' : 'siswa123';
                    const expectedHashed = user.password ? String(user.password).trim() : await hashPassword(defaultPass);
                    if (inputHashed !== expectedHashed) return showAlert.error('Password Salah', 'Kata sandi yang Anda masukkan salah!');
                }
                onLogin(user);
            };

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                    <Card className="w-full max-w-md p-6 space-y-5">
                        <div className="text-center">
                            <div className="text-3xl mb-1">🇮🇩</div>
                            <h2 className="text-lg font-black text-brand-dark">{SCHOOL_IDENTITY.name}</h2>
                            <p className="text-xs text-gray-400 font-bold">Masuk Sistem Pembiasaan Karakter</p>
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                            {[
                                { role: ROLES.SISWA, label: 'Siswa', icon: '👦' },
                                { role: ROLES.GURU, label: 'Guru', icon: '👨‍🏫' },
                                { role: ROLES.ADMIN, label: 'Admin', icon: '⚙️' }
                            ].map(r => (
                                <button key={r.role} type="button" onClick={() => setSelectedRole(r.role)} className={`p-3 rounded-xl flex flex-col items-center border-2 text-xs font-bold transition-all ${selectedRole === r.role ? 'border-brand-red bg-red-50 text-brand-red' : 'border-gray-100 text-gray-500'}`}>
                                    <span className="text-xl mb-1">{r.icon}</span>
                                    {r.label}
                                </button>
                            ))}
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">Pilih Nama Pengguna:</label>
                                {users.length > 0 && (
                                    <div className="relative mb-2">
                                        <i className="fas fa-search absolute left-3.5 top-3 text-gray-400 text-xs"></i>
                                        <input
                                            type="text"
                                            placeholder={`Ketik nama atau username ${selectedRole}...`}
                                            value={searchQuery}
                                            onChange={e => setSearchQuery(e.target.value)}
                                            className="w-full pl-9 pr-3 py-2 bg-gray-50 border rounded-xl text-xs font-semibold focus:ring-2 focus:ring-brand-red outline-none"
                                        />
                                    </div>
                                )}
                                {users.length === 0 ? (
                                    <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-xs font-semibold text-center">
                                        Belum ada akun {selectedRole}. Lakukan sync awal atau login sebagai Admin.
                                    </div>
                                ) : filteredUsers.length === 0 ? (
                                    <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-brand-red text-xs font-semibold text-center">
                                        Tidak ada akun {selectedRole} dengan kata kunci "{searchQuery}".
                                    </div>
                                ) : (
                                    <select value={selectedUserId} onChange={e => setSelectedUserId(e.target.value)} className="w-full p-3 bg-gray-50 border rounded-xl text-sm font-semibold">
                                        {filteredUsers.map(u => <option key={u.id} value={u.id}>{u.name} (@{u.username}){u.className ? ` - ${u.className}` : ''}</option>)}
                                    </select>
                                )}
                            </div>
                            <div>
                                <div className="flex justify-between items-center mb-1">
                                    <label className="text-xs font-bold text-gray-600">Kata Sandi:</label>
                                    <button type="button" onClick={handleForgotPassword} className="text-[11px] font-bold text-brand-red hover:underline transition-colors">
                                        Lupa Kata Sandi?
                                    </button>
                                </div>
                                <input type="password" value={inputPassword} onChange={e => setInputPassword(e.target.value)} placeholder="Masukkan kata sandi..." className="w-full p-3 bg-gray-50 border rounded-xl text-sm font-semibold focus:ring-2 focus:ring-brand-red outline-none" required />
                            </div>
                            <Button type="submit" fullWidth disabled={!selectedUserId || filteredUsers.length === 0}>Masuk Sistem</Button>
                        </form>
                    </Card>
                </div>
            );
        };

        const App = () => {
            const [currentPath, setCurrentPath] = useState('/');
            const [user, setUser] = useState(null);
            const [compact, setCompact] = useState(localStorage.getItem(COMPACT_STORAGE_KEY) === 'true');
            const { isOnline, syncStatus, triggerSync, triggerManualPull } = useOnlineSyncEngine();
            const lastActivityRef = useRef(Date.now());

            const handleSetCompact = (val) => {
                setCompact(val);
                localStorage.setItem(COMPACT_STORAGE_KEY, String(val));
            };

            const recordUserActivity = useCallback(() => {
                const now = Date.now();
                lastActivityRef.current = now;
                const sessionRaw = localStorage.getItem(SESSION_STORAGE_KEY);
                if (sessionRaw) {
                    try {
                        const session = JSON.parse(sessionRaw);
                        session.lastActive = now;
                        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session));
                    } catch (err) {}
                }
            }, []);

            useEffect(() => {
                async function init() {
                    await seedDatabaseClean();
                    pullAllCloudData();
                    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW:', err));

                    const sessionRaw = localStorage.getItem(SESSION_STORAGE_KEY);
                    if (sessionRaw) {
                        try {
                            const session = JSON.parse(sessionRaw);
                            const now = Date.now();
                            if (session.user && (now - session.lastActive < INACTIVITY_TIMEOUT_MS)) {
                                setUser(session.user);
                                setCurrentPath(session.path || (session.user.role === ROLES.SISWA ? '/student/habits' : session.user.role === ROLES.GURU ? '/teacher/dashboard' : '/admin/dashboard'));
                                recordUserActivity();
                            } else {
                                localStorage.removeItem(SESSION_STORAGE_KEY);
                            }
                        } catch (e) { localStorage.removeItem(SESSION_STORAGE_KEY); }
                    }
                }
                init();
            }, [recordUserActivity]);

            useEffect(() => {
                const handleActivity = () => recordUserActivity();
                const events = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'click'];
                events.forEach(ev => window.addEventListener(ev, handleActivity, { passive: true }));

                const interval = setInterval(() => {
                    const sessionRaw = localStorage.getItem(SESSION_STORAGE_KEY);
                    if (sessionRaw) {
                        try {
                            const session = JSON.parse(sessionRaw);
                            if (Date.now() - session.lastActive >= INACTIVITY_TIMEOUT_MS) handleLogout(true);
                        } catch (e) {}
                    }
                }, 10000);

                return () => {
                    events.forEach(ev => window.removeEventListener(ev, handleActivity));
                    clearInterval(interval);
                };
            }, [recordUserActivity]);

            const navigate = (path) => {
                setCurrentPath(path);
                window.scrollTo(0, 0);
                const sessionRaw = localStorage.getItem(SESSION_STORAGE_KEY);
                if (sessionRaw) {
                    try {
                        const session = JSON.parse(sessionRaw);
                        session.path = path;
                        session.lastActive = Date.now();
                        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session));
                    } catch (e) {}
                }
            };

            const handleLogin = (u) => {
                setUser(u);
                let defaultPath = u.role === ROLES.SISWA ? '/student/habits' : u.role === ROLES.GURU ? '/teacher/dashboard' : '/admin/dashboard';
                localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({ user: u, lastActive: Date.now(), path: defaultPath }));
                navigate(defaultPath);
            };

            const handleLogout = (isTimeout = false) => {
                localStorage.removeItem(SESSION_STORAGE_KEY);
                setUser(null);
                navigate('/');
                if (isTimeout) showAlert.warning('Sesi Berakhir', 'Anda telah otomatis keluar karena tidak ada aktivitas selama 15 menit.');
            };

            if (currentPath === '/') return <LandingPage onStart={() => navigate('/login')} />;
            if (currentPath === '/login') return <LoginPage onLogin={handleLogin} triggerManualPull={triggerManualPull} />;
            if (!user) { navigate('/login'); return null; }

            let content = null;
            switch (currentPath) {
                case '/student/habits': content = <StudentHabitsPage user={user} triggerSync={triggerSync} compact={compact} />; break;
                case '/student/calendar': content = <StudentCalendarPage user={user} />; break;
                case '/student/journal': content = <StudentJournalPage user={user} triggerSync={triggerSync} />; break;
                case '/student/profile': content = <StudentProfilePage user={user} triggerSync={triggerSync} />; break;

                case '/teacher/dashboard': content = <TeacherDashboard user={user} triggerSync={triggerSync} triggerManualPull={triggerManualPull} />; break;
                case '/teacher/reports': content = <ReportsModule user={user} />; break;
                case '/teacher/profile': content = <TeacherProfilePage user={user} triggerSync={triggerSync} />; break;

                case '/admin/dashboard': content = <AdminDashboard triggerManualPull={triggerManualPull} navigate={navigate} />; break;
                case '/admin/classes': content = <AdminClassesPage triggerSync={triggerSync} triggerManualPull={triggerManualPull} />; break;
                case '/admin/teachers': content = <AdminTeachersPage triggerSync={triggerSync} triggerManualPull={triggerManualPull} />; break;
                case '/admin/students': content = <AdminStudentsPage triggerSync={triggerSync} triggerManualPull={triggerManualPull} />; break;
                case '/admin/reports': content = <ReportsModule user={user} />; break;
                case '/admin/archives': content = <AdminArchivesPage />; break;
                case '/admin/profile': content = <AdminProfilePage user={user} onUpdateAdmin={setUser} triggerSync={triggerSync} />; break;

                default: content = <StudentHabitsPage user={user} triggerSync={triggerSync} compact={compact} />; break;
            }

            return (
                <AppLayout user={user} currentPath={currentPath} navigate={navigate} onLogout={handleLogout} isOnline={isOnline} syncStatus={syncStatus} triggerManualPull={triggerManualPull} compact={compact} setCompact={handleSetCompact}>
                    {content}
                </AppLayout>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
