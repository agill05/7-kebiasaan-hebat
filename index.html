            { id: 'h3', name: 'Berolahraga', description: 'Aktivitas fisik, senam pagi, atau olahraga ringan minimal 15 menit', icon: '🏃', color: 'bg-green-100 text-green-600', timeLabel: 'Waktu Berolahraga (WITA)', detailLabel: 'Jenis Olahraga & Durasi', detailPlaceholder: 'Contoh: Senam kesegaran jasmani / lari pagi 20 menit' },

            { id: 'h6', name: 'Bermasyarakat', description: 'Membantu orang tua di rumah, sopan santun, dan peduli lingkungan', icon: '🤝', color: 'bg-teal-100 text-teal-600', timeLabel: 'Waktu Beraktivitas (WITA)', detailLabel: 'Bentuk Kebaikan yang Dilakukan', detailPlaceholder: 'Contoh: Membantu orang tua membersihkan rumah dan menyapa tetangga' },
            { id: 'h7', name: 'Tidur Cepat', description: 'Istirahat malam tepat waktu sebelum pukul 21.30 agar bugar esok hari', icon: '😴', color: 'bg-purple-100 text-purple-600', timeLabel: 'Jam Tidur Malam (WITA)', detailLabel: 'Aktivitas Sebelum Tidur', detailPlaceholder: 'Contoh: Tidur jam 21.15 setelah berdoa dan mematikan gawai' }
        ];

        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzD1Um1d0AC60Z39p_WS7u5Dwgs_CjrC7FDTX9GYojRtilomyB0hY9hkSKfqyw_yWpJ/exec";

        // ==========================================
        // SWEETALERT2 HELPER WRAPPER
        // ==========================================
        const showAlert = {
            success: (title, text = '') => {

            },

        // ==========================================
        // DATE & TIME HELPERS
        // ==========================================
        const getTodayWitaDateString = () => {
            const formatter = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Makassar',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
            return formatter.format(new Date());
        };

        const getNowWitaTimeString = () => {
            const formatter = new Intl.DateTimeFormat('id-ID', {
                timeZone: 'Asia/Makassar',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            return formatter.format(new Date()).replace('.', ':');
        };

        const formatDisplayDate = (dateStr) => {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return `${parseInt(d, 10)} ${months[parseInt(m, 10) - 1]} ${y}`;
        };

        // ==========================================
        // HELPER KRIPTOGRAFI
        // ==========================================
        async function hashPassword(text) {
            if (!text) return '';
            const msgBuffer = new TextEncoder().encode(String(text).trim());
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ==========================================
        // DATABASE CLIENT-SIDE (Dexie IndexedDB)
        // ==========================================
        const db = new Dexie('SevenHabitsWitaDB');
        db.version(1).stores({
            users: 'id, username, role, password, phone, classId, mentorId, nisn, nip, status',
            classes: 'id, name, teacherId',
            habits: 'id, name, active',
            habitLogs: 'id, userId, habitId, date, completed, timeValue, detailValue, studentName, className, syncStatus',
            points: 'id, userId, totalPoints',
            streaks: 'userId, currentStreak, longestStreak',
            journals: 'id, userId, date, syncStatus',
            syncQueue: 'id, tableName, recordId, action, status, createdAt'
        });

        // ==========================================
        // ENGINE SINKRONISASI
        // ==========================================
        async function pushPendingQueue() {
            if (!navigator.onLine || !GAS_API_URL || GAS_API_URL.includes("MASUKKAN_URL")) return;

            const pendingQueue = await db.syncQueue.where('status').equals('pending').toArray();
            if (pendingQueue.length === 0) return;

            for (let item of pendingQueue) {
                try {
                    let endpointAction = '';
                    let payloadData = null;

                    if (item.tableName === 'habitLogs') {
                        endpointAction = item.action === 'delete' ? 'deleteHabitLog' : 'syncHabits';
                        payloadData = item.action === 'delete' ? { id: item.recordId } : [await db.habitLogs.get(item.recordId)].filter(Boolean);
                    } else if (item.tableName === 'journals') {
                        endpointAction = item.action === 'delete' ? 'deleteJournal' : 'syncJournal';
                        payloadData = item.action === 'delete' ? { id: item.recordId } : await db.journals.get(item.recordId);
                    } else if (item.tableName === 'users') {
                        endpointAction = item.action === 'delete' ? 'deleteUser' : 'syncUser';
                        payloadData = item.action === 'delete' ? { id: item.recordId } : await db.users.get(item.recordId);
                    } else if (item.tableName === 'classes') {
                        endpointAction = item.action === 'delete' ? 'deleteClass' : 'syncClass';
                        payloadData = item.action === 'delete' ? { id: item.recordId } : await db.classes.get(item.recordId);
                    }

                    if (endpointAction && payloadData) {
                        await fetch(GAS_API_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ action: endpointAction, payload: payloadData })
                        });
                        await db.syncQueue.update(item.id, { status: 'synced' });
                    }
                } catch (e) {
                    console.warn('Queue push error for record:', item.recordId, e);
                }
            }
        }

        async function pullAllCloudData() {
            if (!navigator.onLine || !GAS_API_URL || GAS_API_URL.includes("MASUKKAN_URL")) return false;
            try {
                const res = await fetch(`${GAS_API_URL}?action=getAllData`);
                const json = await res.json();
                
                if (json.status === 'success') {
                    const pendingQueue = await db.syncQueue.where('status').equals('pending').toArray();
                    const pendingUserIds = new Set(pendingQueue.filter(q => q.tableName === 'users').map(q => q.recordId));
                    const pendingClassIds = new Set(pendingQueue.filter(q => q.tableName === 'classes').map(q => q.recordId));
                    const pendingLogIds = new Set(pendingQueue.filter(q => q.tableName === 'habitLogs').map(q => q.recordId));
                    const pendingJournalIds = new Set(pendingQueue.filter(q => q.tableName === 'journals').map(q => q.recordId));

                    if (Array.isArray(json.classes)) {
                        const formattedClasses = json.classes.map(c => ({
                            id: String(c['Class ID'] || c['id'] || '').trim(),
                            name: String(c['Nama Kelas'] || c['name'] || '').trim(),
                            teacherId: String(c['Teacher ID (Wali)'] || c['teacherId'] || '').trim(),
                            teacherName: String(c['Nama Wali Kelas'] || c['teacherName'] || '').trim()
                        })).filter(c => c.id);

                        const cloudClassIds = new Set(formattedClasses.map(c => c.id));
                        const localClasses = await db.classes.toArray();
                        const classesToDelete = localClasses
                            .filter(c => !cloudClassIds.has(c.id) && !pendingClassIds.has(c.id))
                            .map(c => c.id);

                        if (classesToDelete.length > 0) await db.classes.bulkDelete(classesToDelete);
                        if (formattedClasses.length > 0) await db.classes.bulkPut(formattedClasses);
                    }

                    if (Array.isArray(json.users)) {
                        const formattedUsers = json.users.map(u => ({
                            id: String(u['User ID'] || u['id'] || '').trim(),
                            username: String(u['Username'] || u['username'] || '').trim(),
                            name: String(u['Nama Lengkap'] || u['name'] || '').trim(),
                            role: String(u['Role'] || u['role'] || 'siswa').trim().toLowerCase(),
                            password: String(u['Password'] || u['password'] || '').trim(),
                            phone: String(u['Nomor Telepon'] || u['phone'] || '').trim(),
                            className: String(u['Kelas'] || u['className'] || '').trim(),
                            classId: String(u['Class ID'] || u['classId'] || '').trim(),
                            nisn: String(u['NISN'] || u['nisn'] || '').trim(),
                            nip: String(u['NIP'] || u['nip'] || '').trim(),
                            subject: String(u['Mata Pelajaran'] || u['subject'] || '').trim(),
                            homeroomClassId: String(u['Homeroom Class ID'] || u['homeroomClassId'] || '').trim(),
                            mentorId: String(u['Mentor ID'] || u['mentorId'] || '').trim(),
                            mentorName: String(u['Mentor Name'] || u['mentorName'] || '').trim(),
                            createdBy: String(u['Created By'] || u['createdBy'] || 'admin').trim(),
                            status: String(u['Status'] || u['status'] || 'Aktif').trim(),
                            avatar: (u['Role'] === 'guru' ? '👨‍🏫' : u['Role'] === 'admin' ? '⚙️' : (u['gender'] === 'Perempuan' ? '👧' : '👦'))
                        })).filter(u => u.id);

                        const cloudUserIds = new Set(formattedUsers.map(u => u.id));
                        const localUsers = await db.users.toArray();
                        const usersToDelete = localUsers
                            .filter(u => !cloudUserIds.has(u.id) && !pendingUserIds.has(u.id) && u.id !== 'u_admin_default')
                            .map(u => u.id);

                        if (usersToDelete.length > 0) await db.users.bulkDelete(usersToDelete);
                        if (formattedUsers.length > 0) await db.users.bulkPut(formattedUsers);
                    }

                    if (Array.isArray(json.habitLogs)) {
                        const formattedLogs = json.habitLogs.map(l => ({
                            id: String(l['ID Log'] || l['id'] || '').trim(),
                            userId: String(l['User ID'] || l['userId'] || '').trim(),
                            studentName: String(l['Nama Siswa'] || l['studentName'] || '').trim(),
                            className: String(l['Kelas'] || l['className'] || '').trim(),
                            habitId: String(l['Habit ID'] || l['habitId'] || '').trim(),
                            habitName: String(l['Nama Kebiasaan'] || l['habitName'] || '').trim(),
                            date: String(l['Tanggal'] || l['date'] || '').trim().split('T')[0],
                            completed: String(l['Status Selesai'] || l['completed']).trim() === 'Selesai' || l['completed'] === true,
                            timeValue: String(l['Jam / Waktu'] || l['timeValue'] || '').trim(),
                            detailValue: String(l['Detail / Keterangan'] || l['detailValue'] || '').trim(),
                            syncStatus: 'synced'
                        })).filter(l => l.id);

                        const cloudLogIds = new Set(formattedLogs.map(l => l.id));
                        const localLogs = await db.habitLogs.toArray();
                        const logsToDelete = localLogs
                            .filter(l => !cloudLogIds.has(l.id) && !pendingLogIds.has(l.id))
                            .map(l => l.id);

                        if (logsToDelete.length > 0) await db.habitLogs.bulkDelete(logsToDelete);
                        if (formattedLogs.length > 0) await db.habitLogs.bulkPut(formattedLogs);
                    }

                    if (Array.isArray(json.journals)) {
                        const formattedJournals = json.journals.map(j => ({
                            id: String(j['ID Jurnal'] || j['id'] || '').trim(),
                            userId: String(j['User ID'] || j['userId'] || '').trim(),
                            studentName: String(j['Nama Siswa'] || j['studentName'] || '').trim(),
                            className: String(j['Kelas'] || j['className'] || '').trim(),
                            date: String(j['Tanggal'] || j['date'] || '').trim().split('T')[0],
                            mood: String(j['Mood'] || j['mood'] || '').trim(),
                            content: String(j['Isi Jurnal'] || j['content'] || '').trim(),
                            syncStatus: 'synced'
                        })).filter(j => j.id);

                        const cloudJournalIds = new Set(formattedJournals.map(j => j.id));
                        const localJournals = await db.journals.toArray();
                        const journalsToDelete = localJournals
                            .filter(j => !cloudJournalIds.has(j.id) && !pendingJournalIds.has(j.id))
                            .map(j => j.id);

                        if (journalsToDelete.length > 0) await db.journals.bulkDelete(journalsToDelete);
                        if (formattedJournals.length > 0) await db.journals.bulkPut(formattedJournals);
                    }

                    return true;
                }
            } catch (err) {
                console.warn("Pull data notice:", err);
            }
            return false;
        }

                        status: 'Aktif',
                        createdAt: new Date()
                    });
                }
            } catch (err) {
                console.error("Master DB Seed notice:", err);
            }
        }

        function useOnlineSyncEngine() {
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [syncStatus, setSyncStatus] = useState('idle');

            const fullSynchronize = useCallback(async () => {
                if (!navigator.onLine || !GAS_API_URL || GAS_API_URL.includes("MASUKKAN_URL")) return;
                setSyncStatus('syncing');
                try {
                    await pushPendingQueue();
                    await pullAllCloudData();
                    setSyncStatus('synced');
                    setTimeout(() => setSyncStatus('idle'), 3000);
                } catch (e) {
                    setSyncStatus('error');
                    setTimeout(() => setSyncStatus('idle'), 4000);
                }
            }, []);

            useEffect(() => {
                const handleOnline = () => { setIsOnline(true); fullSynchronize(); };
                const handleOffline = () => { setIsOnline(false); setSyncStatus('idle'); };

                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);

                const interval = setInterval(() => {
                    if (navigator.onLine) fullSynchronize();
                }, 35000);

                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                    clearInterval(interval);
                };
            }, [fullSynchronize]);

            return { isOnline, syncStatus, triggerSync: fullSynchronize, triggerManualPull: fullSynchronize };
        }

                    { path: '/teacher/reports', label: 'Laporan & Rekap', icon: 'fas fa-file-invoice' },
                    { path: '/teacher/profile', label: 'Profil Saya', icon: 'fas fa-chalkboard-teacher' },
                ],
                [ROLES.ADMIN]: [
                    { path: '/admin/dashboard', label: 'Ringkasan Sistem', icon: 'fas fa-home' },
                    { path: '/admin/classes', label: 'Data Kelas', icon: 'fas fa-door-open' },
                    { path: '/admin/teachers', label: 'Data Guru', icon: 'fas fa-chalkboard-teacher' },
                    { path: '/admin/students', label: 'Data Siswa', icon: 'fas fa-user-graduate' },
                    { path: '/admin/reports', label: 'Pusat Laporan', icon: 'fas fa-file-invoice' },
                    { path: '/admin/profile', label: 'Profil Admin', icon: 'fas fa-user-shield' },
                ]
            }[user.role] || [];

            return (
                <div className="flex h-screen bg-gray-50 overflow-hidden">
                    <aside className="hidden md:flex flex-col w-64 bg-white shadow-xl z-20 no-print">
                        <div className="p-6 text-center border-b border-gray-100">
                            <div className="text-3xl mb-1">🇮🇩</div>
                            <h2 className="font-extrabold text-brand-red text-xs uppercase leading-tight">7 Kebiasaan Siswa Hebat</h2>
                            <p className="text-[10px] text-gray-400 font-bold mt-1">{SCHOOL_IDENTITY.name}</p>
                        </div>
                        <div className="flex-1 overflow-y-auto py-4 px-3 space-y-1">
                            {navItems.map(item => (
                                <button key={item.path} onClick={() => navigate(item.path)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left font-semibold transition-colors ${currentPath === item.path ? 'bg-brand-red text-white shadow-md' : 'text-gray-500 hover:bg-red-50 hover:text-brand-red'}`}>
                                    <i className={`${item.icon} w-5 text-center`}></i>
                                    {item.label}
                                </button>
                            ))}
                        </div>
                        <div className="p-4 border-t border-gray-100 space-y-3">
                            <div className="flex items-center gap-3 px-2">
                                <div className="w-10 h-10 rounded-full bg-brand-yellow flex items-center justify-center text-white font-bold">{user.avatar || '👤'}</div>
                                <div className="overflow-hidden">
                                    <p className="font-bold text-gray-800 text-sm truncate">{user.name}</p>
                                    <p className="text-xs text-gray-400 capitalize">{user.role}</p>
                                </div>
                            </div>
                            <Button variant="white" fullWidth onClick={() => onLogout(false)} className="text-xs py-2">
                                <i className="fas fa-sign-out-alt mr-2"></i> Keluar
                            </Button>
                        </div>
                    </aside>

                    <main className="flex-1 relative overflow-y-auto pb-20 md:pb-0">
                        <header className="bg-white shadow-sm p-4 sticky top-0 z-10 flex justify-between items-center no-print">
                            <div className="flex items-center gap-2">
                                <span className="text-2xl md:hidden">🇮🇩</span>
                                <div>
                                    <h1 className="font-extrabold text-brand-dark text-sm md:text-base leading-tight">{SCHOOL_IDENTITY.name}</h1>
                                    <p className="text-[10px] text-gray-400">Tahun Pelajaran {SCHOOL_IDENTITY.academicYear}</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={triggerManualPull} title="Tarik & Perbarui Data dari Google Sheets" className={`text-xs px-3 py-1.5 rounded-full font-bold flex items-center gap-1.5 transition-all ${
                                    !isOnline ? 'bg-orange-100 text-orange-600' :
                                    syncStatus === 'syncing' ? 'bg-blue-100 text-blue-600 animate-pulse' :
                                    syncStatus === 'synced' ? 'bg-green-100 text-brand-green' :
                                    'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                }`}>
                                    <i className={`fas ${!isOnline ? 'fa-wifi-slash' : syncStatus === 'syncing' ? 'fa-spinner fa-spin' : 'fa-cloud-download-alt'}`}></i>
                                    <span>{!isOnline ? 'Offline' : syncStatus === 'syncing' ? 'Menyinkronkan...' : syncStatus === 'synced' ? 'Tersinkron' : 'Tarik Cloud'}</span>
                                </button>
                                <button onClick={() => onLogout(false)} className="md:hidden w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600">
                                    <i className="fas fa-power-off text-xs"></i>
                                </button>
                            </div>
                        </header>

                        {!isOnline && (
                            <div className="bg-orange-500 text-white text-center py-1 text-xs font-bold shadow-sm no-print">
                                🛡️ Mode Offline Aktif. Data tersimpan lokal di HP/komputer dan akan diunggah otomatis saat tersambung internet.
                            </div>
                        )}

                        <div className="p-4 md:p-8 max-w-6xl mx-auto">{children}</div>
                    </main>

                    <nav className="md:hidden fixed bottom-0 w-full bg-white shadow-lg border-t border-gray-100 z-50 flex justify-around items-center px-2 py-2 no-print">
                        {navItems.map(item => (
                            <button key={item.path} onClick={() => navigate(item.path)} className={`flex flex-col items-center p-1.5 min-w-[60px] ${currentPath === item.path ? 'text-brand-red' : 'text-gray-400'}`}>
                                <i className={`${item.icon} text-lg mb-1`}></i>
                                <span className="text-[10px] font-bold">{item.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        };

        // ==========================================
        // MODUL LAPORAN & EKSPOR (GURU & ADMIN)
        // ==========================================
        const ReportsModule = ({ user }) => {
            const today = getTodayWitaDateString();
            const [reportType, setReportType] = useState('habits'); // 'habits' | 'journals'
            const [startDate, setStartDate] = useState(today);
            const [endDate, setEndDate] = useState(today);
            const [selectedClassId, setSelectedClassId] = useState('all');
            const [selectedStudentId, setSelectedStudentId] = useState('all');
            const [selectedScope, setSelectedScope] = useState('all'); // for teacher: 'all' | 'homeroom' | 'mentor'

            const [classes, setClasses] = useState([]);
            const [students, setStudents] = useState([]);
            const [habitLogs, setHabitLogs] = useState([]);
            const [journals, setJournals] = useState([]);
            const [loading, setLoading] = useState(true);

            const loadReportData = async () => {
                setLoading(true);
                const c = await db.classes.toArray();
                const s = await db.users.where('role').equals(ROLES.SISWA).toArray();
                const hl = await db.habitLogs.toArray();
                const j = await db.journals.toArray();

                setClasses(c);
                setStudents(s);
                setHabitLogs(hl);
                setJournals(j);
                setLoading(false);
            };

            useEffect(() => { loadReportData(); }, []);

            // Siswa yang dapat diakses berdasarkan Role
            const accessibleStudents = useMemo(() => {
                if (user.role === ROLES.ADMIN) return students;
                return students.filter(s => {
                    const isHomeroom = user.homeroomClassId && s.classId === user.homeroomClassId;
                    const isMentor = s.mentorId === user.id;
                    if (selectedScope === 'homeroom') return isHomeroom;
                    if (selectedScope === 'mentor') return isMentor;
                    return isHomeroom || isMentor;
                });
            }, [students, user, selectedScope]);

            // Data Siswa Terfilter Berdasarkan Kelas & Pilihan Siswa
            const filteredStudentIds = useMemo(() => {
                let list = accessibleStudents;
                if (user.role === ROLES.ADMIN && selectedClassId !== 'all') {
                    list = list.filter(s => s.classId === selectedClassId);
                }
                if (selectedStudentId !== 'all') {
                    list = list.filter(s => s.id === selectedStudentId);
                }
                return new Set(list.map(s => s.id));
            }, [accessibleStudents, selectedClassId, selectedStudentId, user.role]);

            // Data Laporan Terfilter Berdasarkan Rentang Tanggal
            const filteredHabitLogs = useMemo(() => {
                return habitLogs.filter(l => {
                    return filteredStudentIds.has(l.userId) &&
                        l.date >= startDate &&
                        l.date <= endDate;
                }).sort((a, b) => b.date.localeCompare(a.date) || a.studentName.localeCompare(b.studentName));
            }, [habitLogs, filteredStudentIds, startDate, endDate]);

            const filteredJournals = useMemo(() => {
                return journals.filter(j => {
                    return filteredStudentIds.has(j.userId) &&
                        j.date >= startDate &&
                        j.date <= endDate;
                }).sort((a, b) => b.date.localeCompare(a.date) || a.studentName.localeCompare(b.studentName));
            }, [journals, filteredStudentIds, startDate, endDate]);

            // STATISTIK RINGKASAN LAPORAN
            const reportStats = useMemo(() => {
                if (reportType === 'habits') {
                    const totalRecords = filteredHabitLogs.length;
                    const completedCount = filteredHabitLogs.filter(l => l.completed).length;
                    const completionRate = totalRecords > 0 ? Math.round((completedCount / totalRecords) * 100) : 0;
                    return { total: totalRecords, completed: completedCount, rate: completionRate };
                } else {
                    return { total: filteredJournals.length };
                }
            }, [reportType, filteredHabitLogs, filteredJournals]);

            // EKSPOR EXCEL MENGGUNAKAN SHEETJS
            const handleExportExcel = () => {
                if (reportType === 'habits') {
                    if (filteredHabitLogs.length === 0) {
                        showAlert.warning('Data Kosong', 'Tidak ada data log kebiasaan pada periode dan filter yang dipilih.');
                        return;
                    }

                    const excelData = filteredHabitLogs.map((l, index) => {
                        const std = students.find(s => s.id === l.userId);
                        return {
                            'No': index + 1,
                            'Tanggal': l.date,
                            'NISN': std?.nisn || '-',
                            'Nama Siswa': l.studentName,
                            'Kelas': l.className || std?.className || '-',
                            'Guru Mentor': std?.mentorName || '-',
                            'Pilar Kebiasaan': l.habitName,
                            'Status': l.completed ? 'Selesai' : 'Belum Selesai',
                            'Jam Pelaksanaan (WITA)': l.timeValue || '-',
                            'Keterangan Aktivitas': l.detailValue || '-'
                        };
                    });

                    const worksheet = XLSX.utils.json_to_sheet(excelData);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap 7 Kebiasaan");

                    const fileName = `Rekap_7Kebiasaan_${SCHOOL_IDENTITY.name.replace(/\s+/g, '_')}_${startDate}_sd_${endDate}.xlsx`;
                    XLSX.writeFile(workbook, fileName);
                    showAlert.success('Berhasil Diunduh', `File Excel ${fileName} berhasil diekspor.`);
                } else {
                    if (filteredJournals.length === 0) {
                        showAlert.warning('Data Kosong', 'Tidak ada data jurnal refleksi pada periode dan filter yang dipilih.');
                        return;
                    }

                    const excelData = filteredJournals.map((j, index) => {
                        const std = students.find(s => s.id === j.userId);
                        return {
                            'No': index + 1,
                            'Tanggal Refleksi': j.date,
                            'NISN': std?.nisn || '-',
                            'Nama Siswa': j.studentName,
                            'Kelas': j.className || std?.className || '-',
                            'Guru Mentor': std?.mentorName || '-',
                            'Suasana Hati (Mood)': j.mood,
                            'Catatan Refleksi & Pembelajaran': j.content
                        };
                    });

                    const worksheet = XLSX.utils.json_to_sheet(excelData);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap Jurnal");

                    const fileName = `Rekap_Jurnal_${SCHOOL_IDENTITY.name.replace(/\s+/g, '_')}_${startDate}_sd_${endDate}.xlsx`;
                    XLSX.writeFile(workbook, fileName);
                    showAlert.success('Berhasil Diunduh', `File Excel ${fileName} berhasil diekspor.`);
                }
            };

            // EKSPOR PDF MENGGUNAKAN JSPDF + AUTOTABLE
            const handleExportPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('landscape', 'pt', 'a4');

                // Header Resmi Dokumen Sekolah
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(14);
                doc.text(SCHOOL_IDENTITY.name.toUpperCase(), doc.internal.pageSize.getWidth() / 2, 40, { align: 'center' });
                
                doc.setFontSize(10);
                doc.setFont('helvetica', 'normal');
                doc.text(`LAPORAN REKAPITULASI PROGRAM 7 KEBIASAAN ANAK INDONESIA HEBAT`, doc.internal.pageSize.getWidth() / 2, 56, { align: 'center' });
                doc.text(`Periode: ${formatDisplayDate(startDate)} s.d. ${formatDisplayDate(endDate)} • Tahun Ajaran ${SCHOOL_IDENTITY.academicYear}`, doc.internal.pageSize.getWidth() / 2, 70, { align: 'center' });

                doc.setDrawColor(200, 200, 200);
                doc.setLineWidth(1);
                doc.line(40, 80, doc.internal.pageSize.getWidth() - 40, 80);

                if (reportType === 'habits') {
                    if (filteredHabitLogs.length === 0) {
                        showAlert.warning('Data Kosong', 'Tidak ada data log kebiasaan untuk dicetak.');
                        return;
                    }

                    const tableRows = filteredHabitLogs.map((l, index) => {
                        const std = students.find(s => s.id === l.userId);
                        return [
                            index + 1,
                            l.date,
                            l.studentName,
                            l.className || std?.className || '-',
                            l.habitName,
                            l.completed ? 'Selesai' : 'Belum',
                            l.timeValue || '-',
                            l.detailValue || '-'
                        ];
                    });

                    doc.autoTable({
                        startY: 90,
                        head: [['No', 'Tanggal', 'Nama Siswa', 'Kelas', 'Kebiasaan', 'Status', 'Jam', 'Keterangan Aktivitas']],
                        body: tableRows,
                        theme: 'grid',
                        headStyles: { fillColor: [239, 68, 68], textColor: 255, fontStyle: 'bold', halign: 'center' },
                        styles: { fontSize: 8, cellPadding: 4, valign: 'middle' },
                        columnStyles: {
                            0: { halign: 'center', cellWidth: 25 },
                            1: { halign: 'center', cellWidth: 55 },
                            2: { cellWidth: 110 },
                            3: { halign: 'center', cellWidth: 45 },
                            4: { cellWidth: 95 },
                            5: { halign: 'center', cellWidth: 45 },
                            6: { halign: 'center', cellWidth: 40 },
                            7: { cellWidth: 'auto' }
                        }
                    });
                } else {
                    if (filteredJournals.length === 0) {
                        showAlert.warning('Data Kosong', 'Tidak ada data jurnal untuk dicetak.');
                        return;
                    }

                    const tableRows = filteredJournals.map((j, index) => {
                        const std = students.find(s => s.id === j.userId);
                        return [
                            index + 1,
                            j.date,
                            j.studentName,
                            j.className || std?.className || '-',
                            j.mood,
                            j.content
                        ];
                    });

                    doc.autoTable({
                        startY: 90,
                        head: [['No', 'Tanggal', 'Nama Siswa', 'Kelas', 'Suasana Hati (Mood)', 'Isi Refleksi Harian']],
                        body: tableRows,
                        theme: 'grid',
                        headStyles: { fillColor: [59, 130, 246], textColor: 255, fontStyle: 'bold', halign: 'center' },
                        styles: { fontSize: 8, cellPadding: 5, valign: 'middle' },
                        columnStyles: {
                            0: { halign: 'center', cellWidth: 25 },
                            1: { halign: 'center', cellWidth: 65 },
                            2: { cellWidth: 120 },
                            3: { halign: 'center', cellWidth: 50 },
                            4: { halign: 'center', cellWidth: 90 },
                            5: { cellWidth: 'auto' }
                        }
                    });
                }

                // Footer Tanda Tangan
                const finalY = (doc.lastAutoTable.finalY || 100) + 30;
                if (finalY < doc.internal.pageSize.getHeight() - 80) {
                    const pageWidth = doc.internal.pageSize.getWidth();
                    doc.setFontSize(9);
                    doc.text(`Talaga Jaya, ${formatDisplayDate(today)}`, pageWidth - 180, finalY);
                    doc.text(user.role === ROLES.ADMIN ? 'Administrator Sistem,' : 'Guru Pembimbing / Wali Kelas,', pageWidth - 180, finalY + 15);
                    doc.setFont('helvetica', 'bold');
                    doc.text(user.name, pageWidth - 180, finalY + 55);
                    if (user.nip) doc.text(`NIP: ${user.nip}`, pageWidth - 180, finalY + 67);
                }

                const fileName = `Laporan_${reportType === 'habits' ? '7Kebiasaan' : 'Jurnal'}_${startDate}_sd_${endDate}.pdf`;
                doc.save(fileName);
                showAlert.success('Berhasil Diunduh', `File PDF ${fileName} siap dicetak.`);
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 no-print">
                        <div>
                            <h1 className="text-2xl font-black text-brand-dark">📊 Pusat Laporan & Rekapitulasi</h1>
                            <p className="text-gray-500 font-medium text-sm">Rekapitulasi pencatatan pembiasaan karakter dan jurnal refleksi siswa.</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                            <Button variant="green" onClick={handleExportExcel} className="text-xs py-2 px-3.5 flex items-center gap-1.5">
                                <i className="fas fa-file-excel"></i> Ekspor Excel (.xlsx)
                            </Button>
                            <Button variant="primary" onClick={handleExportPDF} className="text-xs py-2 px-3.5 flex items-center gap-1.5">
                                <i className="fas fa-file-pdf"></i> Cetak / Unduh PDF
                            </Button>
                        </div>
                    </div>

                    {/* FILTER PANEL */}
                    <Card className="no-print space-y-4">
                        <div className="flex gap-2 border-b border-gray-100 pb-3 overflow-x-auto text-xs font-extrabold">
                            <button onClick={() => setReportType('habits')} className={`px-4 py-2 rounded-xl transition-all ${reportType === 'habits' ? 'bg-brand-red text-white shadow-sm' : 'bg-gray-50 text-gray-600 hover:bg-gray-100'}`}>
                                <i className="fas fa-check-circle mr-1.5"></i> Rekap 7 Kebiasaan Siswa
                            </button>
                            <button onClick={() => setReportType('journals')} className={`px-4 py-2 rounded-xl transition-all ${reportType === 'journals' ? 'bg-brand-blue text-white shadow-sm' : 'bg-gray-50 text-gray-600 hover:bg-gray-100'}`}>
                                <i className="fas fa-book mr-1.5"></i> Rekap Jurnal Refleksi
                            </button>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
                            <div>
                                <label className="block font-bold text-gray-600 mb-1">Mulai Tanggal</label>
                                <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full p-2.5 bg-gray-50 border rounded-xl font-bold text-brand-dark" />
                            </div>
                            <div>
                                <label className="block font-bold text-gray-600 mb-1">Sampai Tanggal</label>
                                <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="w-full p-2.5 bg-gray-50 border rounded-xl font-bold text-brand-dark" />
                            </div>

                            {user.role === ROLES.ADMIN ? (
                                <div>
                                    <label className="block font-bold text-gray-600 mb-1">Filter Kelas</label>
                                    <select value={selectedClassId} onChange={e => setSelectedClassId(e.target.value)} className="w-full p-2.5 bg-gray-50 border rounded-xl font-bold text-brand-dark">
                                        <option value="all">-- Semua Rombel / Kelas --</option>
                                        {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                </div>
                            ) : (
                                <div>
                                    <label className="block font-bold text-gray-600 mb-1">Kategori Binaan Guru</label>
                                    <select value={selectedScope} onChange={e => setSelectedScope(e.target.value)} className="w-full p-2.5 bg-gray-50 border rounded-xl font-bold text-brand-dark">
                                        <option value="all">Semua Siswa Binaan Saya</option>
                                        <option value="homeroom">Kelas Binaan (Wali Kelas)</option>
                                        <option value="mentor">Kelompok Mentoring</option>
                                    </select>
                                </div>
                            )}

                            <div>
                                <label className="block font-bold text-gray-600 mb-1">Pilih Siswa Spesifik</label>
                                <select value={selectedStudentId} onChange={e => setSelectedStudentId(e.target.value)} className="w-full p-2.5 bg-gray-50 border rounded-xl font-bold text-brand-dark">
                                    <option value="all">-- Semua Siswa Terkait --</option>
                                    {accessibleStudents.map(s => <option key={s.id} value={s.id}>{s.name} ({s.className || '-'})</option>)}
                                </select>
                            </div>
                        </div>
                    </Card>

                    {/* STATISTIK RINGKAS */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <Card className="text-center py-4 bg-gradient-to-br from-red-50 to-white border-red-100">
                            <span className="text-2xl font-black text-brand-red">{reportStats.total}</span>
                            <p className="text-xs font-bold text-gray-500 uppercase mt-1">Total Catatan Tercatat</p>
                        </Card>
                        {reportType === 'habits' ? (
                            <>
                                <Card className="text-center py-4 bg-gradient-to-br from-green-50 to-white border-green-100">
                                    <span className="text-2xl font-black text-brand-green">{reportStats.completed}</span>
                                    <p className="text-xs font-bold text-gray-500 uppercase mt-1">Kebiasaan Selesai</p>
                                </Card>
                                <Card className="text-center py-4 bg-gradient-to-br from-blue-50 to-white border-blue-100">
                                    <span className="text-2xl font-black text-brand-blue">{reportStats.rate}%</span>
                                    <p className="text-xs font-bold text-gray-500 uppercase mt-1">Tingkat Kepatuhan</p>
                                </Card>
                            </>
                        ) : (
                            <Card className="text-center py-4 bg-gradient-to-br from-blue-50 to-white border-blue-100 md:col-span-2">
                                <span className="text-2xl font-black text-brand-blue">{reportStats.total} Siswa</span>
                                <p className="text-xs font-bold text-gray-500 uppercase mt-1">Refleksi Terkumpul</p>
                            </Card>
                        )}
                    </div>

                    {/* PRATINJAU TABEL DATA */}
                    <Card>
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-extrabold text-sm text-brand-dark">
                                Pratinjau Tabel Laporan ({reportType === 'habits' ? `${filteredHabitLogs.length} Baris` : `${filteredJournals.length} Baris`})
                            </h3>
                        </div>

                        {loading ? (
                            <div className="text-center py-10 text-xs font-bold text-gray-400">
                                <i className="fas fa-spinner fa-spin mr-2"></i> Memuat data laporan...
                            </div>
                        ) : reportType === 'habits' ? (
                            filteredHabitLogs.length === 0 ? (
                                <EmptyState icon="📋" title="Tidak Ada Log Kebiasaan" description="Coba ubah rentang tanggal atau filter siswa untuk melihat data." />
                            ) : (
                                <div className="overflow-x-auto max-h-[450px] overflow-y-auto">
                                    <table className="w-full text-left text-xs whitespace-nowrap">
                                        <thead className="bg-gray-50 text-gray-500 font-bold sticky top-0">
                                            <tr>
                                                <th className="p-3">Tanggal</th>
                                                <th className="p-3">Nama Siswa</th>
                                                <th className="p-3">Kelas</th>
                                                <th className="p-3">Kebiasaan</th>
                                                <th className="p-3">Jam (WITA)</th>
                                                <th className="p-3">Keterangan</th>
                                                <th className="p-3 text-center">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredHabitLogs.map(l => (
                                                <tr key={l.id} className="border-b border-gray-50 hover:bg-gray-50/60">
                                                    <td className="p-3 font-semibold text-gray-600">{l.date}</td>
                                                    <td className="p-3 font-extrabold text-brand-dark">{l.studentName}</td>
                                                    <td className="p-3 font-bold text-brand-red">{l.className || '-'}</td>
                                                    <td className="p-3 font-semibold text-gray-700">{l.habitName}</td>
                                                    <td className="p-3 font-bold text-brand-blue">{l.timeValue || '-'}</td>

                        detailValue: l.detailValue

                setLogs(logMap);

                const p = await db.points.where('userId').equals(user.id).first();
                setPoints(p ? p.totalPoints : 0);
            };

                const wasCompleted = logs[habit.id]?.completed;

                await db.habitLogs.put({

                    syncStatus: 'pending',

                    action: 'upsert',
                    status: 'pending',
                    createdAt: new Date()

                showAlert.success('Berhasil!', 'Nomor telepon berhasil diperbarui.');
                triggerSync();
            };

                e.preventDefault();
                if (newPass !== confirmPass) {
                    showAlert.warning('Perhatian', 'Password baru dan konfirmasi tidak cocok!');
                    return;
                }
                const oldHash = await hashPassword(oldPass);
                const currentHash = user.password || await hashPassword('guru123');

                if (oldHash !== currentHash) {
                    showAlert.error('Gagal', 'Password lama yang Anda masukkan salah!');
                    return;
                }

                const newHashed = await hashPassword(newPass);
                const updated = { ...user, password: newHashed };
                await db.users.put(updated);
                await db.syncQueue.put({ id: `sync_p_${Date.now()}`, tableName: 'users', recordId: user.id, action: 'update', status: 'pending', createdAt: new Date() });
                
                showAlert.success('Berhasil!', 'Password akun Guru Anda berhasil diubah.');

        // ==========================================
        // LOGIN & LANDING
        // ==========================================
        const LandingPage = ({ onStart }) => (
            <div className="min-h-screen bg-white flex flex-col justify-center items-center px-4 text-center">
                <div className="text-6xl mb-3">🇮🇩</div>
                <h1 className="text-3xl md:text-5xl font-black text-brand-dark mb-3">7 Kebiasaan <span className="text-brand-red">Anak Indonesia Hebat</span></h1>
                <p className="text-gray-500 max-w-md text-sm md:text-base mb-8">Pencatatan pembiasaan karakter positif siswa {SCHOOL_IDENTITY.name}.</p>
                <Button onClick={onStart} className="text-base py-3.5 px-8">Masuk ke Aplikasi</Button>

        );

        const LoginPage = ({ onLogin, onBack, triggerManualPull }) => {
            const [users, setUsers] = useState([]);
            const [selectedRole, setSelectedRole] = useState(ROLES.SISWA);
            const [selectedUserId, setSelectedUserId] = useState('');
            const [inputPassword, setInputPassword] = useState('');
            const [isLoadingPull, setIsLoadingPull] = useState(true);

            const loadUsers = async () => {
                const res = await db.users.where('role').equals(selectedRole).toArray();
                setUsers(res);
                if (res.length > 0) setSelectedUserId(res[0].id);
                else setSelectedUserId('');
            };

            useEffect(() => {
                loadUsers();
                setInputPassword('');
            }, [selectedRole]);

            useEffect(() => {
                async function syncInit() {
                    setIsLoadingPull(true);
                    await triggerManualPull();
                    await loadUsers();
                    setIsLoadingPull(false);
                }
                syncInit();
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!selectedUserId) {
                    showAlert.warning('Perhatian', 'Pilih akun Anda terlebih dahulu!');
                    return;
                }

                const user = await db.users.get(selectedUserId);
                if (!user) {
                    showAlert.error('Gagal', 'Akun tidak ditemukan!');
                    return;
                }

                const typedPassword = String(inputPassword).trim();

                if (user.role === ROLES.ADMIN) {
                    const expected = String(user.password || 'admin').trim();
                    if (typedPassword !== expected) {
                        showAlert.error('Akses Ditolak', 'Password Administrator salah!');
                        return;
                    }
                } else {
                    const inputHashed = await hashPassword(typedPassword);
                    const defaultPass = user.role === ROLES.GURU ? 'guru123' : 'siswa123';
                    const expectedHashed = user.password ? String(user.password).trim() : await hashPassword(defaultPass);

                    if (inputHashed !== expectedHashed) {
                        showAlert.error('Password Salah', 'Password salah! Jika lupa password, silakan hubungi Guru / Wali Kelas Anda.');
                        return;
                    }
                }

                onLogin(user);
            };

            const handleRefreshManual = async () => {
                setIsLoadingPull(true);
                await triggerManualPull();
                await loadUsers();
                setIsLoadingPull(false);
                showAlert.success('Tersinkron', 'Data akun berhasil diperbarui dari cloud Google Sheets!');
            };

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                    <Card className="w-full max-w-md p-6 space-y-5">
                        <div className="text-center">
                            <div className="text-3xl mb-1">🇮🇩</div>
                            <h2 className="text-lg font-black text-brand-dark">{SCHOOL_IDENTITY.name}</h2>
                            <p className="text-xs text-gray-400 font-bold">Masuk dengan Akun & Password</p>
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                            {[
                                { role: ROLES.SISWA, label: 'Siswa', icon: '👦' },
                                { role: ROLES.GURU, label: 'Guru', icon: '👨‍🏫' },
                                { role: ROLES.ADMIN, label: 'Admin', icon: '⚙️' }
                            ].map(r => (
                                <button key={r.role} type="button" onClick={() => setSelectedRole(r.role)} className={`p-3 rounded-xl flex flex-col items-center border-2 text-xs font-bold transition-all ${selectedRole === r.role ? 'border-brand-red bg-red-50 text-brand-red' : 'border-gray-100 text-gray-500'}`}>
                                    <span className="text-xl mb-1">{r.icon}</span>
                                    {r.label}
                                </button>
                            ))}
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <div className="flex justify-between items-center mb-1">
                                    <label className="block text-xs font-bold text-gray-600">Pilih Nama Pengguna:</label>
                                    <button type="button" onClick={handleRefreshManual} disabled={isLoadingPull} className="text-[11px] font-bold text-brand-blue hover:underline flex items-center gap-1">
                                        <i className={`fas fa-sync-alt ${isLoadingPull ? 'fa-spin' : ''}`}></i> Perbarui Akun
                                    </button>
                                </div>
                                {isLoadingPull ? (
                                    <div className="p-3 bg-gray-50 border rounded-xl text-xs text-gray-500 text-center font-bold">
                                        <i className="fas fa-spinner fa-spin mr-1"></i> Memuat data akun dari Google Sheets...
                                    </div>
                                ) : users.length === 0 ? (
                                    <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-xs font-semibold text-center">
                                        Belum ada akun {selectedRole}. Masuk sebagai Admin untuk mendaftarkan akun.
                                    </div>
                                ) : (
                                    <select value={selectedUserId} onChange={e => setSelectedUserId(e.target.value)} className="w-full p-3 bg-gray-50 border rounded-xl text-sm font-semibold">

                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">Kata Sandi / Password:</label>
                                <input 
                                    type="password" 
                                    value={inputPassword} 
                                    onChange={e => setInputPassword(e.target.value)} 
                                    placeholder={selectedRole === ROLES.ADMIN ? "Password admin" : "Masukkan password Anda..."} 
                                    className="w-full p-3 bg-gray-50 border rounded-xl text-sm font-semibold focus:ring-2 focus:ring-brand-red outline-none" 
                                    required 
                                />

                                    <p className="text-[11px] text-gray-400 mt-1.5 leading-relaxed">
                                        💡 Password bawaan: <strong>{selectedRole === ROLES.GURU ? 'guru123' : 'siswa123'}</strong>. Jika lupa password, hubungi {selectedRole === ROLES.GURU ? 'Admin Sekolah' : 'Guru / Wali Kelas'} Anda.

                    </Card>

        // ==========================================
        // ROOT CONTROLLER (DENGAN SESI & INACTIVITY LOGOUT)
        // ==========================================
        const App = () => {
            const [currentPath, setCurrentPath] = useState('/');
            const [user, setUser] = useState(null);
            const { isOnline, syncStatus, triggerSync, triggerManualPull } = useOnlineSyncEngine();
            const lastActivityRef = useRef(Date.now());

            // Helper Update Timestamp Aktivitas Sesi
            const recordUserActivity = useCallback(() => {
                const now = Date.now();
                lastActivityRef.current = now;
                const sessionRaw = localStorage.getItem(SESSION_STORAGE_KEY);
                if (sessionRaw) {
                    try {
                        const session = JSON.parse(sessionRaw);
                        session.lastActive = now;
                        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session));
                    } catch (err) {}
                }
            }, []);

            // Inisialisasi & Restore Sesi dari LocalStorage
            useEffect(() => {
                async function init() {
                    await seedDatabaseClean();
                    await pullAllCloudData();
                    if ('serviceWorker' in navigator) {
                        navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW Notice:', err));
                    }

                    // Cek Sesi yang Ada
                    const sessionRaw = localStorage.getItem(SESSION_STORAGE_KEY);
                    if (sessionRaw) {
                        try {
                            const session = JSON.parse(sessionRaw);
                            const now = Date.now();
                            if (session.user && (now - session.lastActive < INACTIVITY_TIMEOUT_MS)) {
                                setUser(session.user);
                                setCurrentPath(session.path || (session.user.role === ROLES.SISWA ? '/student/habits' : session.user.role === ROLES.GURU ? '/teacher/dashboard' : '/admin/dashboard'));
                                recordUserActivity();
                            } else {
                                localStorage.removeItem(SESSION_STORAGE_KEY);
                            }
                        } catch (e) {
                            localStorage.removeItem(SESSION_STORAGE_KEY);
                        }
                    }
                }
                init();
            }, [recordUserActivity]);

            // Deteksi Aktivitas Pengguna (Mouse, Keyboard, Touch, Scroll)
            useEffect(() => {
                const handleActivity = () => recordUserActivity();

                const events = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'click'];
                events.forEach(ev => window.addEventListener(ev, handleActivity, { passive: true }));

                // Pengecekan Timer Idle Setiap 10 Detik
                const interval = setInterval(() => {
                    const sessionRaw = localStorage.getItem(SESSION_STORAGE_KEY);
                    if (sessionRaw) {
                        try {
                            const session = JSON.parse(sessionRaw);
                            const now = Date.now();
                            if (now - session.lastActive >= INACTIVITY_TIMEOUT_MS) {
                                handleLogout(true);
                            }
                        } catch (e) {}
                    }
                }, 10000);

                return () => {
                    events.forEach(ev => window.removeEventListener(ev, handleActivity));
                    clearInterval(interval);
                };
            }, [recordUserActivity]);

            const navigate = (path) => {
                setCurrentPath(path);
                window.scrollTo(0, 0);
                // Simpan Path Terakhir ke Sesi
                const sessionRaw = localStorage.getItem(SESSION_STORAGE_KEY);
                if (sessionRaw) {
                    try {
                        const session = JSON.parse(sessionRaw);
                        session.path = path;
                        session.lastActive = Date.now();
                        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session));
                    } catch (e) {}
                }
            };

            const handleLogin = (u) => {
                setUser(u);
                let defaultPath = '/student/habits';
                if (u.role === ROLES.GURU) defaultPath = '/teacher/dashboard';
                else if (u.role === ROLES.ADMIN) defaultPath = '/admin/dashboard';

                // Simpan Sesi Baru ke LocalStorage
                localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
                    user: u,
                    lastActive: Date.now(),
                    path: defaultPath
                }));

                navigate(defaultPath);
            };

            const handleLogout = (isTimeout = false) => {
                localStorage.removeItem(SESSION_STORAGE_KEY);
                setUser(null);
                navigate('/');
                if (isTimeout) {
                    showAlert.warning(
                        'Sesi Berakhir',
                        'Anda telah otomatis keluar karena tidak ada aktivitas selama 15 menit.'
                    );
                }
            };

            const handleUpdateAdminProfile = (updatedUser) => {
                setUser(updatedUser);
                const sessionRaw = localStorage.getItem(SESSION_STORAGE_KEY);
                if (sessionRaw) {
                    try {
                        const session = JSON.parse(sessionRaw);
                        session.user = updatedUser;
                        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session));
                    } catch (e) {}
                }
            };

            if (currentPath === '/') return <LandingPage onStart={() => navigate('/login')} />;
            if (currentPath === '/login') return <LoginPage onLogin={handleLogin} onBack={() => navigate('/')} triggerManualPull={triggerManualPull} />;
            if (!user) { navigate('/login'); return null; }

            let content = null;
            switch (currentPath) {
                // Rute Siswa
                case '/student/habits': content = <StudentHabitsPage user={user} triggerSync={triggerSync} />; break;
                case '/student/calendar': content = <StudentCalendarPage user={user} />; break;
                case '/student/journal': content = <StudentJournalPage user={user} triggerSync={triggerSync} />; break;
                case '/student/profile': content = <StudentProfilePage user={user} triggerSync={triggerSync} />; break;

                // Rute Guru
                case '/teacher/dashboard': content = <TeacherDashboard user={user} triggerSync={triggerSync} triggerManualPull={triggerManualPull} />; break;
                case '/teacher/reports': content = <ReportsModule user={user} />; break;
                case '/teacher/profile': content = <TeacherProfilePage user={user} triggerSync={triggerSync} />; break;

                // Rute Admin
                case '/admin/dashboard': content = <AdminDashboard triggerManualPull={triggerManualPull} />; break;
                case '/admin/classes': content = <AdminClassesPage triggerSync={triggerSync} triggerManualPull={triggerManualPull} />; break;
                case '/admin/teachers': content = <AdminTeachersPage triggerSync={triggerSync} triggerManualPull={triggerManualPull} />; break;
                case '/admin/students': content = <AdminStudentsPage triggerSync={triggerSync} triggerManualPull={triggerManualPull} />; break;
                case '/admin/reports': content = <ReportsModule user={user} />; break;
                case '/admin/profile': content = <AdminProfilePage user={user} onUpdateAdmin={handleUpdateAdminProfile} triggerSync={triggerSync} />; break;

                default: content = <StudentHabitsPage user={user} triggerSync={triggerSync} />; break;
            }

            return (
                <AppLayout 
                    user={user} 
                    currentPath={currentPath} 
                    navigate={navigate} 
                    onLogout={handleLogout} 
                    isOnline={isOnline} 
                    syncStatus={syncStatus} 
                    triggerManualPull={triggerManualPull}
                >
                    {content}
                </AppLayout>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
