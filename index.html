            { id: 'h7', shortName: 'Tidur Cepat', name: 'Tidur Cepat', defaultTime: '21:15', defaultDetail: 'Tidur malam tepat waktu dan mematikan gawai', icon: '😴', color: 'bg-purple-100 text-purple-600', timeLabel: 'Jam Tidur Malam (WITA)', detailLabel: 'Aktivitas Sebelum Tidur', detailPlaceholder: 'Contoh: Tidur jam 21.15 setelah berdoa dan mematikan gawai' }
        ];

        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzD1Um1d0AC60Z39p_WS7u5Dwgs_CjrC7FDTX9GYojRtilomyB0hY9hkSKfqyw_yWpJ/exec";

        const showAlert = {
            success: (title, text = '') => Swal.fire({ icon: 'success', title, text, confirmButtonColor: '#EF4444', customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-xl font-bold px-5 py-2.5' } }),
            error: (title, text = '') => Swal.fire({ icon: 'error', title, text, confirmButtonColor: '#EF4444', customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-xl font-bold px-5 py-2.5' } }),
            warning: (title, text = '') => Swal.fire({ icon: 'warning', title, text, confirmButtonColor: '#EF4444', customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-xl font-bold px-5 py-2.5' } }),
            confirm: async (title, text = '', confirmText = 'Ya, Lanjutkan') => Swal.fire({
                title, text, icon: 'warning', showCancelButton: true, confirmButtonColor: '#EF4444', cancelButtonColor: '#6B7280', confirmButtonText: confirmText, cancelButtonText: 'Batal',
                customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-xl font-bold px-5 py-2.5', cancelButton: 'rounded-xl font-bold px-5 py-2.5' }
            })
        };

        const getTodayWitaDateString = () => {
            const formatter = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Makassar', year: 'numeric', month: '2-digit', day: '2-digit' });
            return formatter.format(new Date());
        };

        const getNowWitaTimeString = () => {
            const formatter = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Makassar', hour: '2-digit', minute: '2-digit', hour12: false });
            return formatter.format(new Date()).replace('.', ':');
        };

        const formatDisplayDate = (dateStr) => {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return `${parseInt(d, 10)} ${months[parseInt(m, 10) - 1]} ${y}`;
        };

        const getDatesInRange = (startStr, endStr) => {
            const dates = [];
            let curr = new Date(startStr + 'T00:00:00');
            const end = new Date(endStr + 'T00:00:00');
            while (curr <= end) {
                const y = curr.getFullYear();
                const m = String(curr.getMonth() + 1).padStart(2, '0');
                const d = String(curr.getDate()).padStart(2, '0');
                dates.push(`${y}-${m}-${d}`);
                curr.setDate(curr.getDate() + 1);
            }
            return dates;
        };

        async function hashPassword(text) {
            if (!text) return '';
            const msgBuffer = new TextEncoder().encode(String(text).trim());
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function promptResetPassword(targetUser, defaultPass = 'siswa123') {
            const { value: newPasswordResult } = await Swal.fire({
                title: `Reset Kata Sandi`,
                html: `
                    <div class="text-left text-xs space-y-3 pt-2 text-gray-700">
                        <p class="leading-relaxed">Mereset kata sandi akun <b>${targetUser.name}</b> (@${targetUser.username}):</p>
                        <div>
                            <label class="block font-bold text-gray-600 mb-1">Opsi Kata Sandi Baru:</label>
                            <select id="swal-reset-type" class="w-full p-2.5 bg-gray-50 border rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-brand-red">
                                <option value="default">Reset ke Kata Sandi Standar ("${defaultPass}")</option>
                                <option value="custom">Tentukan Kata Sandi Baru (Kustom)</option>
                            </select>
                        </div>
                        <div id="swal-custom-pass-container" style="display:none;">
                            <label class="block font-bold text-gray-600 mb-1">Ketik Kata Sandi Baru:</label>
                            <input id="swal-custom-pass" type="text" placeholder="Minimal 4 karakter" class="w-full p-2.5 bg-gray-50 border rounded-xl text-xs font-bold text-brand-red focus:outline-none focus:ring-2 focus:ring-brand-red" />
                        </div>
                    </div>
                `,
                didOpen: () => {
                    const resetType = document.getElementById('swal-reset-type');
                    const customContainer = document.getElementById('swal-custom-pass-container');
                    const customInput = document.getElementById('swal-custom-pass');
                    resetType.addEventListener('change', (e) => {
                        if (e.target.value === 'custom') {
                            customContainer.style.display = 'block';
                            customInput.focus();
                        } else {
                            customContainer.style.display = 'none';
                        }
                    });
                },
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonColor: '#EF4444',
                cancelButtonColor: '#6B7280',
                confirmButtonText: '🔑 Terapkan Reset',
                cancelButtonText: 'Batal',
                customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-xl font-bold px-5 py-2.5', cancelButton: 'rounded-xl font-bold px-5 py-2.5' },
                preConfirm: () => {
                    const type = document.getElementById('swal-reset-type').value;
                    const customVal = document.getElementById('swal-custom-pass').value.trim();
                    if (type === 'custom') {
                        if (!customVal || customVal.length < 4) {
                            Swal.showValidationMessage('Kata sandi baru minimal 4 karakter!');
                            return false;
                        }
                        return customVal;
                    }
                    return defaultPass;
                }
            });

            if (newPasswordResult) {
                const newPlainPass = newPasswordResult;
                const hashedPass = await hashPassword(newPlainPass);
                const updatedUser = { ...targetUser, password: hashedPass, updatedAt: new Date() };

                await db.users.put(updatedUser);
                await db.syncQueue.put({
                    id: `sync_reset_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
                    tableName: 'users',
                    recordId: targetUser.id,
                    action: 'update',
                    status: 'pending',
                    createdAt: new Date()
                });

                await Swal.fire({
                    icon: 'success',
                    title: 'Kata Sandi Berhasil Direset!',
                    html: `
                        <div class="text-sm text-gray-700 space-y-2 pt-1">
                            <p>Kata sandi untuk <b>${targetUser.name}</b> (@${targetUser.username}) berhasil diubah menjadi:</p>
                            <div class="p-3 bg-red-50 border border-red-200 rounded-xl font-mono text-lg font-black text-brand-red select-all tracking-wider">
                                ${newPlainPass}
                            </div>
                            <p class="text-xs text-gray-400">Silakan sampaikan kata sandi baru ini kepada pengguna bersangkutan.</p>
                        </div>
                    `,
                    confirmButtonColor: '#EF4444',
                    confirmButtonText: 'Selesai',
                    customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-xl font-bold px-5 py-2.5' }
                });

                return true;
            }
            return false;
        }

        const db = new Dexie('SevenHabitsWitaDB');
        db.version(2).stores({
            users: 'id, username, role, password, phone, classId, mentorId, nisn, nip, status',
            classes: 'id, name, teacherId',
            habits: 'id, name, active',
            habitLogs: 'id, userId, habitId, date, completed, timeValue, detailValue, studentName, className, syncStatus',
            points: 'id, userId, totalPoints',
            streaks: 'userId, currentStreak, longestStreak',
            journals: 'id, userId, date, teacherFeedback, syncStatus',
            syncQueue: 'id, tableName, recordId, action, status, createdAt'
        });

        // BATCH SYNC ENGINE (FULL BULK CONSOLIDATION - PREVENTS GAS LOCK COLLISION)
        async function pushPendingQueue() {
            if (!navigator.onLine || !GAS_API_URL || GAS_API_URL.includes("MASUKKAN_URL")) return;

            const pendingQueue = await db.syncQueue.where('status').equals('pending').toArray();
            if (pendingQueue.length === 0) return;

            // 1. KONSOLIDASI BATCH HABIT LOGS (KIRIM DALAM 1 REQUEST)
            const habitUpsertIds = pendingQueue.filter(q => q.tableName === 'habitLogs' && (q.action === 'upsert' || q.action === 'create' || q.action === 'update')).map(q => q.recordId);
            if (habitUpsertIds.length > 0) {
                const logs = await db.habitLogs.bulkGet(habitUpsertIds);
                const validLogs = logs.filter(Boolean);
                if (validLogs.length > 0) {
                    await fetch(GAS_API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'syncHabits', payload: validLogs })
                    });
                }
            }

            // 2. KONSOLIDASI BATCH USERS (SEMUA GURU & SISWA DIKIRIM SEKALIGUS)
            const userUpsertIds = pendingQueue.filter(q => q.tableName === 'users' && (q.action === 'create' || q.action === 'update')).map(q => q.recordId);
            if (userUpsertIds.length > 0) {
                const users = await db.users.bulkGet(userUpsertIds);
                const validUsers = users.filter(Boolean);
                if (validUsers.length > 0) {
                    await fetch(GAS_API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'syncUser', payload: validUsers })
                    });
                }
            }

            // 3. KONSOLIDASI BATCH CLASSES
            const classUpsertIds = pendingQueue.filter(q => q.tableName === 'classes' && (q.action === 'create' || q.action === 'update')).map(q => q.recordId);
            if (classUpsertIds.length > 0) {
                const classes = await db.classes.bulkGet(classUpsertIds);
                const validClasses = classes.filter(Boolean);
                if (validClasses.length > 0) {
                    await fetch(GAS_API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'syncClass', payload: validClasses })
                    });
                }
            }

            // 4. KONSOLIDASI BATCH JOURNALS
            const journalUpsertIds = pendingQueue.filter(q => q.tableName === 'journals' && (q.action === 'upsert' || q.action === 'create' || q.action === 'update')).map(q => q.recordId);
            if (journalUpsertIds.length > 0) {
                const journals = await db.journals.bulkGet(journalUpsertIds);
                const validJournals = journals.filter(Boolean);
                if (validJournals.length > 0) {
                    await fetch(GAS_API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'syncJournal', payload: validJournals })
                    });
                }
            }

            // 5. PROSES DELETE (JIKA ADA)
            const deleteItems = pendingQueue.filter(q => q.action === 'delete');
            for (let item of deleteItems) {
                let endpointAction = '';
                if (item.tableName === 'habitLogs') endpointAction = 'deleteHabitLog';
                else if (item.tableName === 'journals') endpointAction = 'deleteJournal';
                else if (item.tableName === 'users') endpointAction = 'deleteUser';
                else if (item.tableName === 'classes') endpointAction = 'deleteClass';

                if (endpointAction) {
                    await fetch(GAS_API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: endpointAction, payload: { id: item.recordId } })
                    });
                }
            }

            // Tandai antrean yang sudah diproses menjadi 'synced'
            const allPendingIds = pendingQueue.map(q => q.id);
            for (let id of allPendingIds) {
                await db.syncQueue.update(id, { status: 'synced' });
            }
        }

        async function pullAllCloudData() {
            if (!navigator.onLine || !GAS_API_URL || GAS_API_URL.includes("MASUKKAN_URL")) return false;
            try {
                const res = await fetch(`${GAS_API_URL}?action=getAllData`);
                const json = await res.json();

                if (json.status === 'success') {
                    const pendingQueue = await db.syncQueue.where('status').equals('pending').toArray();
                    const pendingUserIds = new Set(pendingQueue.filter(q => q.tableName === 'users').map(q => q.recordId));
                    const pendingClassIds = new Set(pendingQueue.filter(q => q.tableName === 'classes').map(q => q.recordId));
                    const pendingLogIds = new Set(pendingQueue.filter(q => q.tableName === 'habitLogs').map(q => q.recordId));
                    const pendingJournalIds = new Set(pendingQueue.filter(q => q.tableName === 'journals').map(q => q.recordId));

                    if (Array.isArray(json.classes)) {
                        const formattedClasses = json.classes.map(c => ({
                            id: String(c['Class ID'] || c['id'] || '').trim(),
                            name: String(c['Nama Kelas'] || c['name'] || '').trim(),
                            teacherId: String(c['Teacher ID (Wali)'] || c['teacherId'] || '').trim(),
                            teacherName: String(c['Nama Wali Kelas'] || c['teacherName'] || '').trim()
                        })).filter(c => c.id);

                        const cloudClassIds = new Set(formattedClasses.map(c => c.id));
                        const localClasses = await db.classes.toArray();
                        const classesToDelete = localClasses.filter(c => !cloudClassIds.has(c.id) && !pendingClassIds.has(c.id)).map(c => c.id);

                        if (classesToDelete.length > 0) await db.classes.bulkDelete(classesToDelete);
                        if (formattedClasses.length > 0) await db.classes.bulkPut(formattedClasses);
                    }

                    if (Array.isArray(json.users)) {
                        const formattedUsers = json.users.map(u => ({
                            id: String(u['User ID'] || u['id'] || '').trim(),
                            username: String(u['Username'] || u['username'] || '').trim(),
                            name: String(u['Nama Lengkap'] || u['name'] || '').trim(),
                            role: String(u['Role'] || u['role'] || 'siswa').trim().toLowerCase(),
                            password: String(u['Password'] || u['password'] || '').trim(),
                            phone: String(u['Nomor Telepon'] || u['phone'] || '').trim(),
                            className: String(u['Kelas'] || u['className'] || '').trim(),
                            classId: String(u['Class ID'] || u['classId'] || '').trim(),
                            nisn: String(u['NISN'] || u['nisn'] || '').trim(),
                            nip: String(u['NIP'] || u['nip'] || '').trim(),
                            subject: String(u['Mata Pelajaran'] || u['subject'] || '').trim(),
                            homeroomClassId: String(u['Homeroom Class ID'] || u['homeroomClassId'] || '').trim(),
                            mentorId: String(u['Mentor ID'] || u['mentorId'] || '').trim(),
                            mentorName: String(u['Mentor Name'] || u['mentorName'] || '').trim(),
                            createdBy: String(u['Created By'] || u['createdBy'] || 'admin').trim(),
                            status: String(u['Status'] || u['status'] || 'Aktif').trim(),
                            avatar: (u['Role'] === 'guru' ? '👨‍🏫' : u['Role'] === 'admin' ? '⚙️' : (u['gender'] === 'Perempuan' ? '👧' : '👦'))
                        })).filter(u => u.id);

                        const cloudUserIds = new Set(formattedUsers.map(u => u.id));
                        const localUsers = await db.users.toArray();
                        const usersToDelete = localUsers.filter(u => !cloudUserIds.has(u.id) && !pendingUserIds.has(u.id) && u.id !== 'u_admin_default').map(u => u.id);

                        if (usersToDelete.length > 0) await db.users.bulkDelete(usersToDelete);
                        if (formattedUsers.length > 0) await db.users.bulkPut(formattedUsers);
                    }

                    if (Array.isArray(json.habitLogs)) {
                        const formattedLogs = json.habitLogs.map(l => ({
                            id: String(l['ID Log'] || l['id'] || '').trim(),
                            userId: String(l['User ID'] || l['userId'] || '').trim(),
                            studentName: String(l['Nama Siswa'] || l['studentName'] || '').trim(),
                            className: String(l['Kelas'] || l['className'] || '').trim(),
                            habitId: String(l['Habit ID'] || l['habitId'] || '').trim(),
                            habitName: String(l['Nama Kebiasaan'] || l['habitName'] || '').trim(),
                            date: String(l['Tanggal'] || l['date'] || '').trim().split('T')[0],
                            completed: String(l['Status Selesai'] || l['completed']).trim() === 'Selesai' || l['completed'] === true,
                            timeValue: String(l['Jam / Waktu'] || l['timeValue'] || '').trim(),
                            detailValue: String(l['Detail / Keterangan'] || l['detailValue'] || '').trim(),
                            syncStatus: 'synced'
                        })).filter(l => l.id);

                        const cloudLogIds = new Set(formattedLogs.map(l => l.id));
                        const localLogs = await db.habitLogs.toArray();
                        const logsToDelete = localLogs.filter(l => !cloudLogIds.has(l.id) && !pendingLogIds.has(l.id)).map(l => l.id);

                        if (logsToDelete.length > 0) await db.habitLogs.bulkDelete(logsToDelete);
                        if (formattedLogs.length > 0) await db.habitLogs.bulkPut(formattedLogs);
                    }

                    if (Array.isArray(json.journals)) {
                        const formattedJournals = json.journals.map(j => ({
                            id: String(j['ID Jurnal'] || j['id'] || '').trim(),
                            userId: String(j['User ID'] || j['userId'] || '').trim(),
                            studentName: String(j['Nama Siswa'] || j['studentName'] || '').trim(),
                            className: String(j['Kelas'] || j['className'] || '').trim(),
                            date: String(j['Tanggal'] || j['date'] || '').trim().split('T')[0],
                            mood: String(j['Mood'] || j['mood'] || '').trim(),
                            content: String(j['Isi Jurnal'] || j['content'] || '').trim(),
                            teacherFeedback: String(j['Catatan Guru'] || j['teacherFeedback'] || '').trim(),
                            syncStatus: 'synced'
                        })).filter(j => j.id);

                        const cloudJournalIds = new Set(formattedJournals.map(j => j.id));
                        const localJournals = await db.journals.toArray();
                        const journalsToDelete = localJournals.filter(l => !cloudJournalIds.has(l.id) && !pendingJournalIds.has(l.id)).map(l => l.id);

                        if (journalsToDelete.length > 0) await db.journals.bulkDelete(journalsToDelete);
                        if (formattedJournals.length > 0) await db.journals.bulkPut(formattedJournals);
                    }

                    return true;
                }
            } catch (err) {
                console.warn("Pull data notice:", err);
            }
            return false;
        }

        function useOnlineSyncEngine() {
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [syncStatus, setSyncStatus] = useState('idle');

            const fullSynchronize = useCallback(async () => {
                if (!navigator.onLine || !GAS_API_URL || GAS_API_URL.includes("MASUKKAN_URL")) return;
                setSyncStatus('syncing');
                try {
                    await pushPendingQueue();
                    await pullAllCloudData();
                    setSyncStatus('synced');
                    setTimeout(() => setSyncStatus('idle'), 2500);
                } catch (e) {
                    setSyncStatus('error');
                    setTimeout(() => setSyncStatus('idle'), 3000);
                }
            }, []);

            useEffect(() => {
                const handleOnline = () => { setIsOnline(true); fullSynchronize(); };
                const handleOffline = () => { setIsOnline(false); setSyncStatus('idle'); };

                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);

                // Polling background setiap 90 detik
                const interval = setInterval(() => {
                    if (navigator.onLine) fullSynchronize();
                }, 90000);

                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                    clearInterval(interval);
                };
            }, [fullSynchronize]);

            return { isOnline, syncStatus, triggerSync: fullSynchronize, triggerManualPull: fullSynchronize };
        }

        const StudentCalendarPage = ({ user }) => {

            useEffect(() => {
                async function loadMonthLogs() {
                    const allLogs = await db.habitLogs.where('userId').equals(user.id).toArray();
                    const map = {};
                    allLogs.forEach(l => {
                        if (!map[l.date]) map[l.date] = 0;

                    });
                    setLogsMap(map);
                }
                loadMonthLogs();
            }, [user.id, currentMonth]);

            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

            return (
                <div className="space-y-6">

                            <span className="font-extrabold text-brand-dark min-w-[130px] text-center text-sm">{monthNames[month]} {year}</span>
                            <Button variant="white" onClick={() => setCurrentMonth(new Date(year, month + 1, 1))} className="py-2 px-3"><i className="fas fa-chevron-right"></i></Button>

                        </div>
                        <div className="grid grid-cols-7 gap-2">
                            {Array.from({ length: firstDay }).map((_, i) => <div key={`empty-${i}`}></div>)}
                            {Array.from({ length: daysInMonth }).map((_, i) => {
                                const day = i + 1;
                                const dayStr = String(day).padStart(2, '0');
                                const mStr = String(month + 1).padStart(2, '0');
                                const dateKey = `${year}-${mStr}-${dayStr}`;

                                        <span className="text-[9px] mt-0.5">{count}/7</span>
                                    </div>
                                );
                            })}
                        </div>
                    </Card>
                </div>
            );

                            </form>

                        <Card className="space-y-3">
                            <h3 className="font-bold text-sm text-gray-700">Riwayat Jurnal & Respon Guru</h3>
                            {savedJournals.length === 0 ? (

                            ) : (
                                <div className="space-y-2.5 max-h-[360px] overflow-y-auto">
                                    {savedJournals.map(j => (

        const StudentProfilePage = ({ user, triggerSync }) => {
            const [oldPass, setOldPass] = useState('');
            const [newPass, setNewPass] = useState('');
            const [confirmPass, setConfirmPass] = useState('');

            const handleChangePassword = async (e) => {
                e.preventDefault();
                if (newPass !== confirmPass) return showAlert.warning('Perhatian', 'Password baru dan konfirmasi tidak cocok!');
                const oldHash = await hashPassword(oldPass);
                const currentHash = user.password || await hashPassword('siswa123');

                if (oldHash !== currentHash) return showAlert.error('Gagal', 'Password lama salah!');

                const newHashed = await hashPassword(newPass);
                const updated = { ...user, password: newHashed };
                await db.users.put(updated);
                await db.syncQueue.put({ id: `sync_p_${Date.now()}`, tableName: 'users', recordId: user.id, action: 'update', status: 'pending', createdAt: new Date() });

                showAlert.success('Berhasil!', 'Password akun Anda berhasil diubah.');
                setOldPass(''); setNewPass(''); setConfirmPass('');

                            <div>

        const TeacherDashboard = ({ user, triggerSync, triggerManualPull }) => {
            const [classes, setClasses] = useState([]);
            const [allStudents, setAllStudents] = useState([]);
            const [selectedTab, setSelectedTab] = useState('all');
            const [filterAlphaOnly, setFilterAlphaOnly] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedDate, setSelectedDate] = useState(getTodayWitaDateString());
            const [classLogs, setClassLogs] = useState([]);

            const [feedbackModalJournal, setFeedbackModalJournal] = useState(null);
            const [feedbackText, setFeedbackText] = useState('');

            const [isStudentModalOpen, setIsStudentModalOpen] = useState(false);
            const [editingStudent, setEditingStudent] = useState(null);
            const [studentFormData, setStudentFormData] = useState({
                name: '', username: '', password: '', nisn: '', gender: 'Laki-laki', classId: user.homeroomClassId || ''
            });

            const loadData = async () => {
                const cls = await db.classes.toArray();
                const stds = await db.users.where('role').equals(ROLES.SISWA).toArray();
                const logs = await db.habitLogs.where('date').equals(selectedDate).toArray();
                setClasses(cls);
                setAllStudents(stds);
                setClassLogs(logs);
            };

            useEffect(() => { loadData(); }, [selectedDate]);

            const filteredStudents = useMemo(() => {
                return allStudents.filter(s => {
                    const isHomeroom = user.homeroomClassId && s.classId === user.homeroomClassId;
                    const isMentor = s.mentorId === user.id;
                    const matchesTab = selectedTab === 'homeroom' ? isHomeroom : selectedTab === 'mentor' ? isMentor : (isHomeroom || isMentor);
                    
                    const query = searchQuery.toLowerCase().trim();
                    const matchesSearch = !query || s.name.toLowerCase().includes(query) || (s.nisn && s.nisn.includes(query)) || s.username.toLowerCase().includes(query);

                    const completedToday = classLogs.some(l => l.userId === s.id && l.completed);
                    const matchesAlpha = !filterAlphaOnly || !completedToday;

                    return matchesTab && matchesSearch && matchesAlpha;
                });
            }, [allStudents, user, selectedTab, searchQuery, filterAlphaOnly, classLogs]);

            const handleOpenFeedbackModal = async (student) => {
                const journal = await db.journals.where('userId').equals(student.id).and(j => j.date === selectedDate).first();
                if (!journal) {
                    return showAlert.warning('Belum Ada Jurnal', `${student.name} belum mengisi jurnal refleksi pada tanggal ${formatDisplayDate(selectedDate)}.`);
                }
                setFeedbackModalJournal(journal);
                setFeedbackText(journal.teacherFeedback || '');
            };

            const handleSaveTeacherFeedback = async (e) => {
                e.preventDefault();
                if (!feedbackModalJournal) return;

                const updatedJournal = { ...feedbackModalJournal, teacherFeedback: feedbackText.trim(), syncStatus: 'pending' };
                await db.journals.put(updatedJournal);
                await db.syncQueue.put({
                    id: `sync_fb_${Date.now()}`, tableName: 'journals', recordId: feedbackModalJournal.id, action: 'upsert', status: 'pending', createdAt: new Date()
                });

                showAlert.success('Apresiasi Tersimpan!', 'Catatan dan apresiasi Anda berhasil dikirim ke siswa.');
                setFeedbackModalJournal(null);
                triggerSync();
            };

            const handleOpenAddModal = () => {
                setEditingStudent(null);
                setStudentFormData({
                    name: '', username: '', password: '', nisn: '', gender: 'Laki-laki', classId: user.homeroomClassId || (classes[0]?.id || '')
                });
                setIsStudentModalOpen(true);
            };

            const handleTeacherSaveStudent = async (e) => {
                e.preventDefault();
                const targetName = studentFormData.name.trim();
                const targetUsername = studentFormData.username.trim();
                const targetNisn = studentFormData.nisn.trim();
                const currentId = editingStudent ? editingStudent.id : null;
                const allUsers = await db.users.toArray();

                if (allUsers.some(u => u.id !== currentId && u.username.toLowerCase() === targetUsername.toLowerCase())) {
                    return showAlert.warning('Peringatan', `Username "@${targetUsername}" sudah digunakan.`);
                }

                const selectedClass = classes.find(c => c.id === studentFormData.classId);

                if (editingStudent) {
                    const updated = {
                        ...editingStudent,
                        name: targetName,
                        username: targetUsername,
                        nisn: targetNisn,
                        gender: studentFormData.gender,
                        classId: studentFormData.classId,
                        className: selectedClass?.name || editingStudent.className,
                        avatar: studentFormData.gender === 'Laki-laki' ? '👦' : '👧',
                        updatedAt: new Date()
                    };
                    await db.users.put(updated);
                    await db.syncQueue.put({ id: `sync_${Date.now()}`, tableName: 'users', recordId: editingStudent.id, action: 'update', status: 'pending', createdAt: new Date() });
                } else {
                    const newId = `u_siswa_${Date.now()}`;
                    const defaultPass = studentFormData.password.trim() || 'siswa123';
                    const hashedPassword = await hashPassword(defaultPass);
                    const created = {
                        id: newId,
                        username: targetUsername,
                        password: hashedPassword,
                        name: targetName,
                        nisn: targetNisn,
                        classId: studentFormData.classId || '',
                        className: selectedClass?.name || '',
                        mentorId: user.id,
                        mentorName: user.name,
                        gender: studentFormData.gender,
                        role: ROLES.SISWA,
                        avatar: studentFormData.gender === 'Laki-laki' ? '👦' : '👧',
                        createdBy: user.name,
                        status: 'Aktif',
                        createdAt: new Date()
                    };
                    await db.users.put(created);
                    await db.syncQueue.put({ id: `sync_${Date.now()}`, tableName: 'users', recordId: newId, action: 'create', status: 'pending', createdAt: new Date() });
                }

                setIsStudentModalOpen(false);
                await loadData();
                triggerSync();
                showAlert.success('Berhasil', 'Data siswa berhasil disimpan.');
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h1 className="text-2xl font-black text-brand-dark">Dashboard Siswa Binaan</h1>
                            <p className="text-gray-500 font-medium text-sm">Monitoring pembiasaan harian, tracking siswa pasif, edit data siswa, dan apresiasi jurnal.</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                            <Button variant="primary" onClick={handleOpenAddModal} className="text-xs py-2 px-3">
                                <i className="fas fa-user-plus mr-1"></i> + Tambah Siswa
                            </Button>
                            <Button variant="white" onClick={triggerManualPull} className="text-xs py-2 px-3">
                                <i className="fas fa-sync-alt mr-1"></i> Tarik Cloud
                            </Button>
                            <input type="date" value={selectedDate} onChange={e => setSelectedDate(e.target.value)} className="p-2 border rounded-xl text-xs font-bold text-brand-red bg-white" />
                        </div>
                    </div>

                    <Card className="space-y-3 p-4">
                        <div className="flex flex-col md:flex-row gap-3 justify-between items-center">
                            <div className="relative w-full md:w-80">
                                <i className="fas fa-search absolute left-3.5 top-3 text-gray-400 text-xs"></i>
                                <input type="text" placeholder="Cari nama, NISN, atau username..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full pl-9 pr-3 py-2 bg-gray-50 border rounded-xl text-xs font-semibold" />
                            </div>
                            <div className="flex items-center gap-2 w-full md:w-auto">
                                <button onClick={() => setFilterAlphaOnly(!filterAlphaOnly)} className={`text-xs px-3.5 py-2 rounded-xl font-extrabold transition-all flex items-center gap-1.5 ${filterAlphaOnly ? 'bg-red-500 text-white shadow-md' : 'bg-red-50 text-brand-red hover:bg-red-100'}`}>
                                    <i className="fas fa-user-clock"></i>
                                    <span>{filterAlphaOnly ? 'Menampilkan: Belum Mengisi Saja' : 'Tampilkan yang Belum Mengisi'}</span>
                                </button>
                            </div>
                        </div>

                        <div className="flex gap-2 border-t pt-3 overflow-x-auto text-xs font-bold">
                            <button onClick={() => setSelectedTab('all')} className={`px-4 py-2 rounded-xl transition-all ${selectedTab === 'all' ? 'bg-brand-red text-white' : 'bg-gray-50 text-gray-600'}`}>
                                Semua Binaan ({allStudents.filter(s => (user.homeroomClassId && s.classId === user.homeroomClassId) || s.mentorId === user.id).length})
                            </button>
                            <button onClick={() => setSelectedTab('homeroom')} className={`px-4 py-2 rounded-xl transition-all ${selectedTab === 'homeroom' ? 'bg-brand-red text-white' : 'bg-gray-50 text-gray-600'}`}>
                                Kelas Binaan (Wali Kelas) ({allStudents.filter(s => user.homeroomClassId && s.classId === user.homeroomClassId).length})
                            </button>
                            <button onClick={() => setSelectedTab('mentor')} className={`px-4 py-2 rounded-xl transition-all ${selectedTab === 'mentor' ? 'bg-brand-red text-white' : 'bg-gray-50 text-gray-600'}`}>
                                Kelompok Mentoring ({allStudents.filter(s => s.mentorId === user.id).length})
                            </button>
                        </div>
                    </Card>

                    {filteredStudents.length === 0 ? (
                        <Card><EmptyState icon="👦" title="Tidak Ada Siswa Ditemukan" description="Coba sesuaikan pencarian atau nonaktifkan filter siswa belum mengisi." /></Card>
                    ) : (
                        <div className="space-y-4">
                            {filteredStudents.map(student => {
