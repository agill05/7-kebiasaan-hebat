                            yellow: '#FBBF24',

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ==========================================
        // 1. KONFIGURASI API GOOGLE APPS SCRIPT
        // ==========================================
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxkL56ZTuymmgPNci_qNK2khBMBTg8CljV_KHamAkrNLFNYmbf9PUsPDJn1sqBAlyJ-lg/exec";

        // ==========================================
        // 2. DATABASE CLIENT-SIDE (Dexie IndexedDB)
        // ==========================================
        const db = new Dexie('SevenHabitsOnlineDB');
        db.version(1).stores({
            users: 'id, username, role, classId, nisn, nis, nip',
            schools: 'id, name',
            classes: 'id, name, teacherId, schoolId',
            habits: 'id, name, active',
            habitLogs: 'id, userId, habitId, date, completed, syncStatus',
            points: 'id, userId, totalPoints',
            streaks: 'userId, currentStreak, longestStreak',
            journals: 'id, userId, date, syncStatus',
            syncQueue: 'id, tableName, recordId, action, status, createdAt'
        });

        const SCHOOL_IDENTITY = {
            name: "SMP NEGERI 1 TALAGA JAYA",
            district: "Kabupaten Gorontalo",
            level: "SMP",
            academicYear: "2026/2027"
        };

        const ROLES = { SISWA: 'siswa', GURU: 'guru', KEPSEK: 'kepsek', ADMIN: 'admin' };

        const HABITS_LIST = [
            { id: 'h1', name: 'Bangun Pagi', description: 'Bangun pagi sebelum subuh dengan penuh semangat', icon: '🌅', color: 'bg-blue-100 text-blue-600', points: 10 },
            { id: 'h2', name: 'Beribadah', description: 'Melaksanakan ibadah tepat waktu sesuai agama/keyakinan', icon: '🙏', color: 'bg-indigo-100 text-indigo-600', points: 10 },
            { id: 'h3', name: 'Berolahraga', description: 'Melakukan aktivitas fisik & senam menjaga kebugaran', icon: '🏃', color: 'bg-green-100 text-green-600', points: 10 },
            { id: 'h4', name: 'Makan Sehat & Bergizi', description: 'Mengonsumsi sarapan dan makanan bergizi seimbang', icon: '🍎', color: 'bg-red-100 text-red-600', points: 10 },
            { id: 'h5', name: 'Gemar Belajar', description: 'Membaca buku dan mengerjakan tugas sekolah', icon: '📚', color: 'bg-yellow-100 text-yellow-600', points: 10 },
            { id: 'h6', name: 'Bermasyarakat', description: 'Membantu orang tua, sopan, dan peduli sesama', icon: '🤝', color: 'bg-teal-100 text-teal-600', points: 10 },
            { id: 'h7', name: 'Tidur Cepat', description: 'Tidur tepat waktu sebelum pukul 21.30 malam', icon: '😴', color: 'bg-purple-100 text-purple-600', points: 10 },
        ];

        // Seeding database lokal jika kosong
        async function seedDatabaseIfNeeded() {
            try {
                const userCount = await db.users.count();
                if (userCount === 0) {
                    await db.schools.put({ id: 'sch1', name: SCHOOL_IDENTITY.name, district: SCHOOL_IDENTITY.district });
                    await db.classes.bulkPut([
                        { id: 'c_vii_1', name: 'VII.1', teacherId: 'u_guru1', schoolId: 'sch1' },
                        { id: 'c_viii_1', name: 'VIII.1', teacherId: 'u_guru2', schoolId: 'sch1' },
                        { id: 'c_ix_1', name: 'IX.1', teacherId: 'u_guru3', schoolId: 'sch1' }
                    ]);
                    await db.habits.bulkPut(HABITS_LIST);
                    
                    await db.users.bulkPut([
                        { id: 'u_admin', username: 'admin', name: 'Administrator Sekolah', role: ROLES.ADMIN, avatar: '⚙️', status: 'Aktif' },
                        { id: 'u_kepsek', username: 'kepsek', name: 'Dra. Hj. Fatmawati, M.Pd', role: ROLES.KEPSEK, avatar: '🏫', status: 'Aktif' },
                        { id: 'u_guru1', username: 'guru1', nip: '198201012005011001', name: 'Rahmat Dai, S.Pd', role: ROLES.GURU, subject: 'Matematika', isHomeroomTeacher: true, homeroomClassId: 'c_vii_1', avatar: '👨‍🏫', status: 'Aktif' },
                    ]);

                    const initialStudents = [];
                    for (let i = 1; i <= 10; i++) {
                        initialStudents.push({
                            id: `u_siswa${i}`,
                            username: `siswa${i}`,
                            nisn: `008923000${i}`,
                            name: `Siswa Binaan ${i}`,
                            role: ROLES.SISWA,
                            classId: 'c_vii_1',
                            className: 'VII.1',
                            gender: i % 2 === 0 ? 'Laki-laki' : 'Perempuan',
                            status: 'Aktif',
                            avatar: i % 2 === 0 ? '👦' : '👧'
                        });
                    }
                    await db.users.bulkPut(initialStudents);

                    const todayStr = new Date().toISOString().split('T')[0];
                    for (let i = 1; i <= 10; i++) {
                        const sid = `u_siswa${i}`;
                        await db.points.put({ id: `p_${sid}`, userId: sid, totalPoints: 70, updatedAt: new Date() });
                        await db.streaks.put({ userId: sid, currentStreak: 3, longestStreak: 7, updatedAt: new Date() });
                    }
                }
            } catch (err) {
                console.error("Inisialisasi Database Lokal Gagal:", err);
            }
        }

        // ==========================================
        // 3. SERVICE SINKRONISASI ONLINE - OFFLINE
        // ==========================================
        function useOnlineSyncEngine() {
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [syncStatus, setSyncStatus] = useState('idle'); // 'idle' | 'syncing' | 'synced' | 'error'

            const processSyncQueue = async () => {
                if (!navigator.onLine || GAS_API_URL.includes("MASUKKAN_URL")) return;

                const pendingQueue = await db.syncQueue.where('status').equals('pending').toArray();
                if (pendingQueue.length === 0) return;

                setSyncStatus('syncing');
                try {
                    // 1. Kumpulkan seluruh batch habit logs
                    const habitLogIds = pendingQueue.filter(q => q.tableName === 'habitLogs').map(q => q.recordId);
                    if (habitLogIds.length > 0) {
                        const logsToSync = await db.habitLogs.where('id').anyOf(habitLogIds).toArray();
                        
                        await fetch(GAS_API_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({
                                action: 'syncHabits',
                                payload: logsToSync
                            })
                        });
                    }

                    // 2. Kumpulkan seluruh batch jurnal
                    const journalIds = pendingQueue.filter(q => q.tableName === 'journals').map(q => q.recordId);
                    if (journalIds.length > 0) {
                        for (let jId of journalIds) {
                            const journal = await db.journals.get(jId);
                            if (journal) {
                                await fetch(GAS_API_URL, {
                                    method: 'POST',
                                    mode: 'no-cors',
                                    headers: { 'Content-Type': 'text/plain' },
                                    body: JSON.stringify({
                                        action: 'syncJournal',
                                        payload: journal
                                    })
                                });
                            }
                        }
                    }

                    // Tandai semua item antrean berhasil disinkronkan
                    for (let item of pendingQueue) {
                        await db.syncQueue.update(item.id, { status: 'synced' });
                    }

                    setSyncStatus('synced');
                    setTimeout(() => setSyncStatus('idle'), 3000);
                } catch (error) {
                    console.error("Gagal sinkronisasi:", error);
                    setSyncStatus('error');
                    setTimeout(() => setSyncStatus('idle'), 4000);
                }
            };

            useEffect(() => {
                const handleOnline = () => { setIsOnline(true); processSyncQueue(); };
                const handleOffline = () => { setIsOnline(false); setSyncStatus('idle'); };

                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);

                // Interval sinkronisasi otomatis setiap 30 detik saat online
                const interval = setInterval(() => {
                    if (navigator.onLine) processSyncQueue();
                }, 30000);

                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                    clearInterval(interval);
                };
            }, []);

            return { isOnline, syncStatus, triggerSync: processSyncQueue };
        }

        // ==========================================
        // 4. UI COMPONENTS UMUM
        // ==========================================
        const Card = ({ children, className = '' }) => (
            <div className={`bg-white rounded-2xl shadow-soft p-5 border border-gray-100 ${className}`}>{children}</div>
        );

        const Button = ({ children, onClick, variant = 'primary', className = '', fullWidth = false, disabled = false, type = 'button' }) => {
            const variants = {
                primary: 'bg-brand-red text-white hover:bg-red-600 shadow-md hover:shadow-lg',
                secondary: 'bg-brand-blue text-white hover:bg-blue-600 shadow-md',
                outline: 'border-2 border-brand-red text-brand-red hover:bg-red-50',
                white: 'bg-white text-gray-800 border border-gray-200 hover:bg-gray-50',
                green: 'bg-brand-green text-white hover:bg-emerald-600 shadow-md'
            };
            return (
                <button type={type} disabled={disabled} onClick={onClick} className={`font-bold py-3 px-6 rounded-xl transition-all transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${fullWidth ? 'w-full' : ''} ${className}`}>
                    {children}
                </button>
            );
        };

        const AppLayout = ({ user, currentPath, navigate, onLogout, isOnline, syncStatus, triggerSync, children }) => {
            const navItems = {
                [ROLES.SISWA]: [
                    { path: '/student/habits', label: 'Kebiasaan', icon: 'fas fa-check-circle' },
                    { path: '/student/calendar', label: 'Kalender', icon: 'fas fa-calendar-alt' },
                    { path: '/student/journal', label: 'Jurnal', icon: 'fas fa-book' },
                ],
                [ROLES.GURU]: [
                    { path: '/teacher/dashboard', label: 'Monitoring Kelas', icon: 'fas fa-chart-line' },
                    { path: '/teacher/profile', label: 'Profil Saya', icon: 'fas fa-user-cog' },
                ],
                [ROLES.ADMIN]: [
                    { path: '/admin/dashboard', label: 'Database Siswa', icon: 'fas fa-database' },
                ]
            }[user.role] || [];

            return (
                <div className="flex h-screen bg-gray-50 overflow-hidden">
                    <aside className="hidden md:flex flex-col w-64 bg-white shadow-xl z-20 no-print">
                        <div className="p-6 text-center border-b border-gray-100">
                            <div className="text-3xl mb-1">🇮🇩</div>
                            <h2 className="font-extrabold text-brand-red text-xs uppercase leading-tight">7 Kebiasaan Siswa Hebat</h2>
                            <p className="text-[10px] text-gray-400 font-bold mt-1">{SCHOOL_IDENTITY.name}</p>
                        </div>
                        <div className="flex-1 overflow-y-auto py-4 px-3 space-y-1">
                            {navItems.map(item => (
                                <button key={item.path} onClick={() => navigate(item.path)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left font-semibold transition-colors ${currentPath === item.path ? 'bg-brand-red text-white shadow-md' : 'text-gray-500 hover:bg-red-50 hover:text-brand-red'}`}>
                                    <i className={`${item.icon} w-5 text-center`}></i>
                                    {item.label}
                                </button>
                            ))}
                        </div>
                        <div className="p-4 border-t border-gray-100 space-y-3">
                            <div className="flex items-center gap-3 px-2">
                                <div className="w-10 h-10 rounded-full bg-brand-yellow flex items-center justify-center text-white font-bold">{user.avatar || '👤'}</div>
                                <div className="overflow-hidden">
                                    <p className="font-bold text-gray-800 text-sm truncate">{user.name}</p>
                                    <p className="text-xs text-gray-400 capitalize">{user.role}</p>
                                </div>
                            </div>
                            <Button variant="white" fullWidth onClick={onLogout} className="text-xs py-2">
                                <i className="fas fa-sign-out-alt mr-2"></i> Keluar
                            </Button>
                        </div>
                    </aside>

                    <main className="flex-1 relative overflow-y-auto pb-20 md:pb-0">
                        <header className="bg-white shadow-sm p-4 sticky top-0 z-10 flex justify-between items-center no-print">
                            <div className="flex items-center gap-2">
                                <span className="text-2xl md:hidden">🇮🇩</span>
                                <div>
                                    <h1 className="font-extrabold text-brand-dark text-sm md:text-base leading-tight">{SCHOOL_IDENTITY.name}</h1>
                                    <p className="text-[10px] text-gray-400">Tahun Ajaran {SCHOOL_IDENTITY.academicYear}</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={triggerSync} title="Sinkronkan Data Manual" className={`text-xs px-3 py-1.5 rounded-full font-bold flex items-center gap-1.5 transition-all ${
                                    !isOnline ? 'bg-orange-100 text-orange-600' :
                                    syncStatus === 'syncing' ? 'bg-blue-100 text-blue-600 animate-pulse' :
                                    syncStatus === 'synced' ? 'bg-green-100 text-brand-green' :
                                    'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                }`}>
                                    <i className={`fas ${!isOnline ? 'fa-wifi-slash' : syncStatus === 'syncing' ? 'fa-spinner fa-spin' : 'fa-cloud'}`}></i>
                                    <span>{!isOnline ? 'Offline' : syncStatus === 'syncing' ? 'Menyinkronkan...' : syncStatus === 'synced' ? 'Tersinkron' : 'Online'}</span>
                                </button>
                                <button onClick={onLogout} className="md:hidden w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600">
                                    <i className="fas fa-power-off text-xs"></i>
                                </button>
                            </div>
                        </header>

                        {!isOnline && (
                            <div className="bg-orange-500 text-white text-center py-1 text-xs font-bold shadow-sm">
                                🛡️ Mode Offline Aktif. Data tersimpan di HP dan otomatis dikirim saat online.
                            </div>
                        )}

                        <div className="p-4 md:p-8 max-w-5xl mx-auto">{children}</div>
                    </main>

                    <nav className="md:hidden fixed bottom-0 w-full bg-white shadow-lg border-t border-gray-100 z-50 flex justify-around items-center px-2 py-2 no-print">
                        {navItems.map(item => (
                            <button key={item.path} onClick={() => navigate(item.path)} className={`flex flex-col items-center p-1.5 min-w-[65px] ${currentPath === item.path ? 'text-brand-red' : 'text-gray-400'}`}>
                                <i className={`${item.icon} text-lg mb-1`}></i>
                                <span className="text-[10px] font-bold">{item.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        };

        // ==========================================
        // 5. MODUL SISWA (Habits, Calendar, Journal)
        // ==========================================
        const StudentHabitsPage = ({ user, triggerSync }) => {
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [logs, setLogs] = useState({});
            const [points, setPoints] = useState(0);

            const loadLogs = async (dateStr) => {
                const userLogs = await db.habitLogs.where('userId').equals(user.id).and(l => l.date === dateStr).toArray();
                const logMap = {};
                userLogs.forEach(l => { logMap[l.habitId] = l.completed; });
                setLogs(logMap);

                const p = await db.points.where('userId').equals(user.id).first();
                setPoints(p ? p.totalPoints : 0);
            };

            useEffect(() => { loadLogs(selectedDate); }, [user.id, selectedDate]);

            const toggleHabit = async (habitId) => {
                const currentStatus = !!logs[habitId];
                const newStatus = !currentStatus;
                const logId = `${user.id}_${habitId}_${selectedDate}`;

                // Simpan ke IndexedDB lokal
                await db.habitLogs.put({
                    id: logId,
                    userId: user.id,
                    habitId: habitId,
                    date: selectedDate,
                    completed: newStatus,
                    syncStatus: 'pending',
                    updatedAt: new Date()
                });

                // Masukkan antrean sinkronisasi
                await db.syncQueue.put({
                    id: `sync_${Date.now()}_${Math.random()}`,
                    tableName: 'habitLogs',
                    recordId: logId,
                    action: 'upsert',
                    status: 'pending',
                    createdAt: new Date()
                });

                setLogs(prev => ({ ...prev, [habitId]: newStatus }));

                const pointDiff = newStatus ? 10 : -10;
                const pRecord = await db.points.where('userId').equals(user.id).first();
                const newTotal = Math.max(0, (pRecord ? pRecord.totalPoints : 0) + pointDiff);
                await db.points.put({ id: `p_${user.id}`, userId: user.id, totalPoints: newTotal, updatedAt: new Date() });
                setPoints(newTotal);

                const updatedLogs = { ...logs, [habitId]: newStatus };
                if (Object.values(updatedLogs).filter(Boolean).length === 7) {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                }

                triggerSync();
            };

            const completedCount = Object.values(logs).filter(Boolean).length;

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h1 className="text-2xl font-black text-brand-dark">Halo, {user.name}! 🌟</h1>
                            <p className="text-gray-500 font-medium text-sm">Amalkan 7 kebiasaan hebat setiap hari.</p>
                        </div>
                        <div className="flex items-center gap-3 bg-white p-2 px-4 rounded-2xl shadow-soft border">
                            <span className="text-xs font-bold text-gray-500">Tanggal:</span>
                            <input type="date" value={selectedDate} onChange={e => setSelectedDate(e.target.value)} className="font-bold text-sm text-brand-red bg-transparent outline-none cursor-pointer" />
                        </div>
                    </div>

                    <Card className="bg-gradient-to-r from-brand-red to-red-600 text-white flex justify-between items-center shadow-lg">
                        <div>
                            <h3 className="font-black text-lg">Progres Hari Ini ({selectedDate})</h3>
                            <p className="text-xs opacity-90">Kumpulkan 10 poin untuk setiap kebiasaan baik.</p>
                        </div>
                        <div className="text-right">
                            <span className="text-4xl font-black">{completedCount}/7</span>
                            <p className="text-xs font-bold uppercase opacity-90">{points} Total Poin</p>
                        </div>
                    </Card>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {HABITS_LIST.map(habit => {
                            const isDone = !!logs[habit.id];
                            return (
                                <div key={habit.id} onClick={() => toggleHabit(habit.id)} className={`p-4 rounded-2xl border-2 cursor-pointer transition-all flex items-center justify-between ${isDone ? 'bg-green-50 border-brand-green shadow-sm' : 'bg-white border-gray-100 hover:border-gray-300'}`}>
                                    <div className="flex items-center gap-4">
                                        <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-2xl ${habit.color}`}>{habit.icon}</div>
                                        <div>
                                            <h3 className="font-bold text-gray-800 text-sm md:text-base">{habit.name}</h3>
                                            <p className="text-xs text-gray-500 leading-snug">{habit.description}</p>
                                        </div>
                                    </div>
                                    <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all ${isDone ? 'bg-brand-green border-brand-green text-white scale-110' : 'border-gray-300'}`}>
                                        {isDone && <i className="fas fa-check text-xs"></i>}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const StudentCalendarPage = ({ user }) => {
            const [currentMonth, setCurrentMonth] = useState(new Date());
            const [logsMap, setLogsMap] = useState({});

            useEffect(() => {
                async function loadMonthLogs() {
                    const allLogs = await db.habitLogs.where('userId').equals(user.id).toArray();
                    const map = {};
                    allLogs.forEach(l => {
                        if (!map[l.date]) map[l.date] = 0;
                        if (l.completed) map[l.date] += 1;
                    });
                    setLogsMap(map);
                }
                loadMonthLogs();
            }, [user.id, currentMonth]);

            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h1 className="text-2xl font-black text-brand-dark">📅 Riwayat Kalender</h1>
                        <div className="flex items-center gap-2">
                            <Button variant="white" onClick={() => setCurrentMonth(new Date(year, month - 1, 1))} className="py-2 px-3"><i className="fas fa-chevron-left"></i></Button>
                            <span className="font-extrabold text-brand-dark min-w-[130px] text-center text-sm">{monthNames[month]} {year}</span>
                            <Button variant="white" onClick={() => setCurrentMonth(new Date(year, month + 1, 1))} className="py-2 px-3"><i className="fas fa-chevron-right"></i></Button>
                        </div>
                    </div>

                    <Card>
                        <div className="grid grid-cols-7 gap-2 text-center font-bold text-xs text-gray-400 mb-2">
                            <span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span>
                        </div>
                        <div className="grid grid-cols-7 gap-2">
                            {Array.from({ length: firstDay }).map((_, i) => <div key={`empty-${i}`}></div>)}
                            {Array.from({ length: daysInMonth }).map((_, i) => {
                                const day = i + 1;
                                const dayStr = String(day).padStart(2, '0');
                                const mStr = String(month + 1).padStart(2, '0');
                                const dateKey = `${year}-${mStr}-${dayStr}`;
                                const count = logsMap[dateKey] || 0;

                                let style = 'bg-gray-50 border-gray-100 text-gray-700';
                                if (count === 7) style = 'bg-green-100 border-brand-green text-brand-green font-black';
                                else if (count > 0) style = 'bg-yellow-50 border-yellow-300 text-yellow-700 font-bold';

                                return (
                                    <div key={day} className={`p-2.5 rounded-xl border-2 flex flex-col items-center justify-center ${style}`}>
                                        <span className="text-xs font-bold">{day}</span>
                                        <span className="text-[9px] mt-0.5">{count}/7</span>
                                    </div>
                                );
                            })}
                        </div>
                    </Card>
                </div>
            );
        };

        const StudentJournalPage = ({ user, triggerSync }) => {
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [mood, setMood] = useState('😊 Senang');
            const [content, setContent] = useState('');
            const [savedJournals, setSavedJournals] = useState([]);

            const loadJournals = async () => {
                const list = await db.journals.where('userId').equals(user.id).toArray();
                setSavedJournals(list);
            };

            useEffect(() => { loadJournals(); }, [user.id]);

            const handleSave = async (e) => {
                e.preventDefault();
                const jId = `j_${user.id}_${selectedDate}`;
                await db.journals.put({
                    id: jId, userId: user.id, date: selectedDate, mood: mood, content: content, syncStatus: 'pending', updatedAt: new Date()
                });
                await db.syncQueue.put({
                    id: `sync_j_${Date.now()}`, tableName: 'journals', recordId: jId, action: 'upsert', status: 'pending', createdAt: new Date()
                });
                alert("✨ Catatan refleksi berhasil disimpan!");
                loadJournals();
                triggerSync();
            };

            return (
                <div className="space-y-6">
                    <h1 className="text-2xl font-black text-brand-dark">📖 Refleksi Harian</h1>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <Card className="lg:col-span-2">
                            <form onSubmit={handleSave} className="space-y-4">
                                <div className="flex justify-between items-center">
                                    <label className="text-xs font-bold text-gray-600">Tanggal:</label>
                                    <input type="date" value={selectedDate} onChange={e => setSelectedDate(e.target.value)} className="p-2 border rounded-xl text-xs font-bold text-brand-red bg-gray-50" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-600 mb-1">Perasaan Hari Ini:</label>
                                    <select value={mood} onChange={e => setMood(e.target.value)} className="w-full p-2.5 bg-gray-50 border rounded-xl font-bold text-sm">
                                        <option value="😀 Sangat Senang">😀 Sangat Senang</option>
                                        <option value="😊 Senang">😊 Senang</option>
                                        <option value="💪 Semangat">💪 Semangat</option>
                                        <option value="😐 Biasa Saja">😐 Biasa Saja</option>
                                        <option value="😔 Kurang Baik">😔 Kurang Baik</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-600 mb-1">Kebaikan & Pelajaran yang Saya Dapatkan Hari Ini:</label>
                                    <textarea rows="5" value={content} onChange={e => setContent(e.target.value)} placeholder="Tuliskan pengalaman positifmu..." className="w-full p-3 bg-gray-50 border rounded-xl text-sm" required></textarea>
                                </div>
                                <Button type="submit" fullWidth variant="primary">💾 Simpan Refleksi</Button>
                            </form>
                        </Card>
                        <Card className="space-y-3">
                            <h3 className="font-bold text-sm text-gray-700">Riwayat Jurnal</h3>
                            <div className="space-y-2 max-h-[300px] overflow-y-auto">
                                {savedJournals.map(j => (
                                    <div key={j.id} className="p-3 bg-gray-50 rounded-xl border border-gray-100 text-xs">
                                        <div className="flex justify-between font-bold text-brand-red mb-1">
                                            <span>{j.date}</span>
                                            <span>{j.mood}</span>
                                        </div>
                                        <p className="text-gray-600 line-clamp-2">{j.content}</p>
                                    </div>
                                ))}
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 6. MODUL GURU & ADMIN
        // ==========================================
        const TeacherDashboard = ({ user }) => {
            const [students, setStudents] = useState([]);
            useEffect(() => {
                db.users.where('classId').equals('c_vii_1').toArray().then(setStudents);
            }, []);

            return (
                <div className="space-y-6">
                    <h1 className="text-2xl font-black text-brand-dark">Dashboard Monitoring Wali Kelas</h1>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <Card className="text-center">
                            <i className="fas fa-users text-3xl text-brand-blue mb-1"></i>
                            <div className="text-2xl font-black">{students.length}</div>
                            <div className="text-xs text-gray-400 font-bold">Total Siswa Binaan</div>
                        </Card>
                        <Card className="text-center">
                            <i className="fas fa-check-double text-3xl text-brand-green mb-1"></i>
                            <div className="text-2xl font-black">88%</div>
                            <div className="text-xs text-gray-400 font-bold">Rata-rata Ketercapaian</div>
                        </Card>
                        <Card className="text-center col-span-2 md:col-span-1">
                            <i className="fas fa-shield-alt text-3xl text-brand-yellow mb-1"></i>
                            <div className="text-2xl font-black">Aktif</div>
                            <div className="text-xs text-gray-400 font-bold">Status Server Cloud</div>
                        </Card>
                    </div>

                    <Card>
                        <h3 className="font-bold text-base mb-3 text-gray-800">Daftar Siswa Kelas VII.1</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-gray-50 text-gray-500 font-bold">
                                    <tr><th className="p-3">Nama Siswa</th><th className="p-3">NISN</th><th className="p-3">Status</th></tr>
                                </thead>
                                <tbody>
                                    {students.map(s => (
                                        <tr key={s.id} className="border-b border-gray-50">
                                            <td className="p-3 font-semibold">{s.name}</td>
                                            <td className="p-3 text-gray-500">{s.nisn}</td>
                                            <td className="p-3"><span className="px-2 py-0.5 rounded-full text-xs font-bold bg-green-100 text-brand-green">Aktif</span></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        };

        const TeacherProfilePage = ({ user }) => (
            <Card className="max-w-md mx-auto text-center space-y-4 py-8">
                <div className="w-20 h-20 rounded-full bg-brand-red text-white text-3xl flex items-center justify-center mx-auto">{user.avatar || '👨‍🏫'}</div>
                <div>
                    <h2 className="text-xl font-black text-brand-dark">{user.name}</h2>
                    <p className="text-xs font-bold text-gray-400">NIP: {user.nip || '-'}</p>
                    <p className="text-xs text-brand-blue font-bold mt-1">Guru Mapel: {user.subject || 'Umum'}</p>
                </div>
            </Card>
        );

        // ==========================================
        // 7. LOGIN & LANDING PAGE
        // ==========================================
        const LandingPage = ({ onStart }) => (
            <div className="min-h-screen bg-white flex flex-col justify-center items-center px-4 text-center">
                <div className="text-6xl mb-3">🇮🇩</div>
                <h1 className="text-3xl md:text-5xl font-black text-brand-dark mb-3">7 Kebiasaan <span className="text-brand-red">Anak Indonesia Hebat</span></h1>
                <p className="text-gray-500 max-w-md text-sm md:text-base mb-8">Aplikasi pencatatan kebiasaan positif dan pembentukan karakter generasi tangguh di {SCHOOL_IDENTITY.name}.</p>
                <Button onClick={onStart} className="text-base py-3.5 px-8">Masuk ke Aplikasi</Button>
            </div>
        );

        const LoginPage = ({ onLogin, onBack }) => {
            const [users, setUsers] = useState([]);
            const [selectedRole, setSelectedRole] = useState(ROLES.SISWA);
            const [selectedUserId, setSelectedUserId] = useState('');

            useEffect(() => {
                db.users.where('role').equals(selectedRole).toArray().then(res => {
                    setUsers(res);
                    if (res.length > 0) setSelectedUserId(res[0].id);
                });
            }, [selectedRole]);

            const handleSubmit = async () => {
                const user = await db.users.get(selectedUserId);
                if (user) onLogin(user);
            };

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                    <Card className="w-full max-w-md p-6 space-y-5">
                        <div className="text-center">
                            <div className="text-3xl mb-1">🇮🇩</div>
                            <h2 className="text-lg font-black text-brand-dark">{SCHOOL_IDENTITY.name}</h2>
                            <p className="text-xs text-gray-400 font-bold">Pilih Akun Demo / Terdaftar</p>
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                            {[{ role: ROLES.SISWA, label: 'Siswa', icon: '👦' }, { role: ROLES.GURU, label: 'Guru', icon: '👨‍🏫' }, { role: ROLES.ADMIN, label: 'Admin', icon: '⚙️' }].map(r => (
                                <button key={r.role} onClick={() => setSelectedRole(r.role)} className={`p-3 rounded-xl flex flex-col items-center border-2 text-xs font-bold transition-all ${selectedRole === r.role ? 'border-brand-red bg-red-50 text-brand-red' : 'border-gray-100 text-gray-500'}`}>
                                    <span className="text-xl mb-1">{r.icon}</span>
                                    {r.label}
                                </button>
                            ))}
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-600 mb-1">Nama Pengguna:</label>
                            <select value={selectedUserId} onChange={e => setSelectedUserId(e.target.value)} className="w-full p-3 bg-gray-50 border rounded-xl text-sm font-semibold">
                                {users.map(u => <option key={u.id} value={u.id}>{u.name} ({u.username})</option>)}
                            </select>
                        </div>
                        <Button fullWidth onClick={handleSubmit}>Buka Dashboard</Button>
                    </Card>
                </div>
            );
        };

        // ==========================================
        // 8. ROOT APPLICATION CONTROLLER
        // ==========================================
        const App = () => {
            const [currentPath, setCurrentPath] = useState('/');
            const [user, setUser] = useState(null);
            const { isOnline, syncStatus, triggerSync } = useOnlineSyncEngine();

            useEffect(() => {
                seedDatabaseIfNeeded();
                // Daftarkan Service Worker PWA jika didukung browser
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW Register Notice:', err));
                }
            }, []);

            const navigate = (path) => { setCurrentPath(path); window.scrollTo(0, 0); };

            const handleLogin = (u) => {
                setUser(u);
                if (u.role === ROLES.SISWA) navigate('/student/habits');
                else if (u.role === ROLES.GURU) navigate('/teacher/dashboard');
                else navigate('/teacher/dashboard');
            };

            const handleLogout = () => { setUser(null); navigate('/'); };

            if (currentPath === '/') return <LandingPage onStart={() => navigate('/login')} />;
            if (currentPath === '/login') return <LoginPage onLogin={handleLogin} onBack={() => navigate('/')} />;
            if (!user) { navigate('/login'); return null; }

            let content = null;
            switch (currentPath) {
                case '/student/habits': content = <StudentHabitsPage user={user} triggerSync={triggerSync} />; break;
                case '/student/calendar': content = <StudentCalendarPage user={user} />; break;
                case '/student/journal': content = <StudentJournalPage user={user} triggerSync={triggerSync} />; break;
                case '/teacher/dashboard': content = <TeacherDashboard user={user} />; break;
                case '/teacher/profile': content = <TeacherProfilePage user={user} />; break;
                default: content = <StudentHabitsPage user={user} triggerSync={triggerSync} />; break;
            }

            return (
                <AppLayout user={user} currentPath={currentPath} navigate={navigate} onLogout={handleLogout} isOnline={isOnline} syncStatus={syncStatus} triggerSync={triggerSync}>
                    {content}
                </AppLayout>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
